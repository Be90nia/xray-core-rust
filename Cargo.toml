[workspace]
resolver = "2"
members = [
    # Protobuf 类型定义
    "crates/xray-proto",

    # Layer 0 - 基础类型
    "crates/xray-buf",
    "crates/xray-common",
    "crates/xray-features",

    # Layer 1 - 加密与数据引擎
    "crates/xray-crypto",
    "crates/xray-geodata",
    "crates/xray-mux",
    "crates/xray-xudp",

    # Layer 2 - 传输基础设施
    "crates/xray-transport",
    "crates/xray-tls",
    "crates/xray-reality",

    # Layer 3 - 传输协议
    "crates/xray-transport-tcp",
    "crates/xray-transport-kcp",
    "crates/xray-transport-hysteria",
    "crates/xray-transport-splithttp",
    "crates/xray-transport-grpc",
    "crates/xray-transport-websocket",
    "crates/xray-transport-httpupgrade",
    "crates/xray-transport-quic",
    "crates/xray-transport-splithttp",
    "crates/xray-transport-naive",
    # Layer 4 - 应用服务
    "crates/xray-app-dns",
    "crates/xray-app-router",
    "crates/xray-app-dispatcher",
    "crates/xray-app-proxyman",
    "crates/xray-app-stats",
    "crates/xray-app-log",
    "crates/xray-app-commander",
    "crates/xray-app-observatory",
    "crates/xray-app-policy",
    "crates/xray-app-reverse",
    "crates/xray-app-metrics",
    "crates/xray-app-geodata",
    "crates/xray-app-version",

    # Layer 5 - 代理协议
    "crates/xray-proxy-vless",
    "crates/xray-proxy-vmess",
    "crates/xray-proxy-ss",
    "crates/xray-proxy-trojan",
    "crates/xray-proxy-socks",
    "crates/xray-proxy-http",
    "crates/xray-proxy-dns",
    "crates/xray-proxy-blackhole",
    "crates/xray-proxy-freedom",
    "crates/xray-proxy-dokodemo",
    "crates/xray-proxy-loopback",
    "crates/xray-proxy-tun",
    "crates/xray-proxy-wireguard",
    "crates/xray-proxy-anytls",
    "crates/xray-proxy-tuic",
    "crates/xray-proxy-hysteria",

    # Layer 6 - 配置
    "crates/xray-conf",

    # Layer 7 - 核心与 CLI
    "crates/xray-core",
    "crates/xray-cli",

    # 集成测试
    "tests",

    # 性能基准测试
    "benches",
    "tests",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MPL-2.0"
repository = "https://github.com/XTLS/Xray-core-rust"
rust-version = "1.85"

[workspace.dependencies]
# 异步运行时
tokio = { version = "1", features = ["full"] }

# 序列化
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
toml = "0.8"

# 错误处理
thiserror = "2"
anyhow = "1"

# 日志
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# 网络
bytes = "1"
socket2 = "0.5"

# yamux 多路复用（反向代理 bridge/portal 用）
yamux = "0.14"
# tokio 工具（futures→tokio trait compat 适配）
tokio-util = { version = "0.7", features = ["io"] }
# 用户态 TCP/IP 协议栈（TUN inbound + WireGuard userspace netstack 用）
smoltcp = { version = "0.12", default-features = false, features = ["std", "alloc", "medium-ip", "socket-tcp", "socket-udp", "socket-icmp", "proto-ipv4", "proto-ipv6"] }
# DNS wire format (仅 proto，覆盖 A/AAAA/MX/TXT/EDNS0 编解码)
hickory-proto = { version = "0.26", default-features = false }
# DNS 异步解析器（DoH/DoT/UDP，对应 Go miekg/dns resolver）
hickory-resolver = { version = "0.26", default-features = false, features = ["tokio", "system-config"] }
# HTTP/2 (DoH)
# HTTP (splithttp/xhttp client)
hyper = { version = "1", features = ["http1", "http2", "client", "server"] }
hyper-util = { version = "0.1", features = ["tokio", "client", "client-legacy", "http1", "http2", "server"] }
http-body-util = "0.1"
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "http2", "ring", "webpki-roots", "logging", "tls12"] }
futures = "0.3"
futures-util = "0.3"
h2 = "0.4"
http = "1"
# QUIC (DoQ + splithttp H3)
quinn = { version = "0.11", default-features = false, features = ["rustls", "ring", "runtime-tokio"] }
quinn-proto = "0.11"
h3 = "0.0.8"
h3-quinn = "0.0.10"

# Protobuf
prost = "0.14"
prost-types = "0.14"
prost-build = "0.14"
tonic-build = "0.14"
tonic-prost-build = "0.14"

# 加密
ring = "0.17"
# Shadowsocks 加密原语（对应 Go shadowsocks/go-shadowsocks2；shadowsocks 是 lib crate，shadowsocks-rust 是 binary）
shadowsocks = { version = "1.24", default-features = false, features = ["aead-cipher"] }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }

# 代理协议库（批次 A：AnyTLS）
anytls = { version = "0.3.5", default-features = false, features = ["client", "server"] }

# TUN 设备 IO（批次 A2：TUN 设备）
tun-rs = { version = "2.8.7", default-features = false, features = ["async_tokio"] }

# WireGuard userspace 协议（批次 B：WireGuard outbound）
boringtun = { version = "0.7.1", default-features = false }

# TLS (watfaq-rustls = Rigby-Foundation/rustls utls-0.23 branch, 提供 REALITY with_reality() API; [patch.crates-io] 全局替换标准 rustls)
rustls = { version = "=0.23.40", default-features = false, features = ["ring", "logging", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging"] }
webpki-roots = "1.0"
rustls-pki-types = "1.0"
# WebSocket (default features 含 connect/handshake，额外加 rustls-tls-webpki-roots)
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }

# UUID
uuid = { version = "1", features = ["v4"] }

# 随机数
rand = "0.9"
# 哈希（finalmask salamander BLAKE2b-256）
blake2 = "0.10"
# 异步 trait 宏（finalmask UDP 伪装链）
async-trait = "0.1"

# CLI
clap = { version = "4", features = ["derive"] }

# 其他
once_cell = "1"
parking_lot = "0.12"
dashmap = "6"

# gRPC over HTTP/2（对应 Go google.golang.org/grpc；xray-transport-grpc + xray-app-commander）
tonic = "0.14"
tonic-prost = "0.14"
tonic-reflection = "0.14"
# 系统进程信息（对应 Go shirou/gopsutil；xray-app-router find_process）
sysinfo = "0.39"
# 零拷贝 HTTP/1.x 解析（对应 Go net/http 内置；sniffer + 性能敏感路径）
httparse = "1.10"
# OCSP 装订客户端（对应 Go crypto/x509 + ocsp；xray-tls OCSP stapling）
ocsp-stapler = { version = "0.4", default-features = false, features = ["ring"] }
# uTLS 指纹伪造（btls = 0x676e67/btls BoringSSL 绑定；提供 GREASE/extension permutation/ECH GREASE/key shares 等 BoringSSL 原生指纹 API；替代 Go uTLS）
btls = { git = "https://github.com/0x676e67/btls", branch = "main" }
tokio-btls = { git = "https://github.com/0x676e67/btls", branch = "main" }
btls-sys = { git = "https://github.com/0x676e67/btls", branch = "main" }
# btls SslRef ForeignTypeRef trait（from_ptr/as_ptr）
foreign-types = "0.5"

[patch.crates-io]
rustls = { git = "https://github.com/Watfaq/rustls.git", branch = "watfaq/0.23.40" }
tokio-rustls = { git = "https://github.com/Watfaq/tokio-rustls.git", branch = "watfaq/0.26.4" }
