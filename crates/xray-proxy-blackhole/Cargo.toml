[package]
name = "xray-proxy-blackhole"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
xray-common = { path = "../xray-common" }
xray-features = { path = "../xray-features" }
xray-transport = { path = "../xray-transport" }
xray-app-dispatcher = { path = "../xray-app-dispatcher" }
xray-proto = { path = "../xray-proto" }
xray-buf = { path = "../xray-buf" }
# P1-7 插件化：L1/L4 面来自装配框架（src/plugin.rs impl xray_frame::Plugin
# 是生产代码——cargo 模型下必须生产依赖；xray-frame 不依赖协议 crate，无环，
# 拍板 P2.1 的"防环"由 xray-frame 单向不引协议 crate 保证）。
xray-frame = { path = "../xray-frame" }
tokio = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
async-trait = "0.1"
# plugin.rs 段路由 JSON 解析（settings.response）；customResponseData base64
# 标准解码对齐 Go conf 层语义（Go :38-42，xray-conf parse_blackhole_response 同规）。
serde_json = { workspace = true }
base64 = "0.22"

[dev-dependencies]
tokio = { workspace = true, features = ["full", "test-util"] }
xray-buf = { path = "../xray-buf" }
