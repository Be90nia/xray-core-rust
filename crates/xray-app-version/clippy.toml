# L3 静态闸（模板 = xray-frame/clippy.toml，T3.1b 批次）：异步托管唯一口 =
# PluginContext::spawn / FxScope（坑约束 #5），日志唯一入口 = LogFacade（坑约束 #10）。
# 本批 app crate 尚未接线 PluginContext，存量裸 spawn 逐点 #[allow] + 理由登记；
# CI 宽门 clippy -D warnings 使 warn 升级为红线。
# 注：`path` 是被禁方法的 def path，不是源码 glob——glob 写进 path 不报 fatal 但
# 禁令静默无效（xray-frame 探针 1 实测），落地禁用该形态。
#
# 注：per-crate clippy.toml 会替换 root 配置（xray-frame 探针 2b 覆盖语义实测），
# root 阈值键在此镜像维护。
# bd g3cr 镜像（root clippy.toml 同键）：unwrap_used 由测试代码
#（cfg(test)/tests/）豁免，生产代码零 unwrap。
allow-unwrap-in-tests = true

disallowed-methods = [
    { path = "std::time::Instant::now", reason = "裸时钟逃逸 Clock 注入面（坑约束 3 表：时钟只经 ctx.clock()）：一律走 PluginContext::clock；确需豁免时 #[allow(clippy::disallowed_methods)] + 理由注释登记（D8 补齐）" },
    { path = "tokio::time::Instant::now", reason = "裸时钟逃逸 Clock 注入面（坑约束 3 表）：一律走 PluginContext::clock；确需豁免时 #[allow(clippy::disallowed_methods)] + 理由注释登记（D8 补齐）" },
    { path = "std::time::SystemTime::now", reason = "裸挂钟逃逸 Clock 注入面（坑约束 3 表）：一律走 PluginContext::clock；确需豁免时 #[allow(clippy::disallowed_methods)] + 理由注释登记（D8 补齐）" },
    { path = "tokio::spawn", reason = "裸 spawn 逃逸 FxScope 生命周期记账（坑约束 #5）：一律走 FxScope/PluginContext::spawn；本批 app crate 未接线 PluginContext，存量调用逐点 #[allow(clippy::disallowed_methods)] + 理由注释登记" },
    { path = "std::thread::spawn", reason = "裸线程逃逸托管与停机编排（坑约束 #5/#6）：阻塞探测等确需 OS 线程的场景逐点 #[allow(clippy::disallowed_methods)] + 理由注释登记" },
]
disallowed-macros = [
    { path = "std::println", reason = "禁直印 stdout：诊断走 tracing/LogFacade（坑约束 #10）" },
    { path = "std::eprintln", reason = "禁直印 stderr：诊断走 tracing/LogFacade（坑约束 #10）" },
]
