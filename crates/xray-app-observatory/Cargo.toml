[package]
name = "xray-app-observatory"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
xray-common = { path = "../xray-common" }
xray-features = { path = "../xray-features" }
xray-proto = { path = "../xray-proto" }
# soqc：探测执行体经 outbound 拨号（dispatch_tagged）+ rustls 完整 HTTPS GET。
xray-buf = { path = "../xray-buf" }
xray-transport = { path = "../xray-transport" }
xray-app-dispatcher = { path = "../xray-app-dispatcher" }
xray-tls = { path = "../xray-tls" }
# P3-3：观测事件复用 xray_frame::observe 统一四元组与 LogFacade 落点。
xray-frame = { path = "../xray-frame" }
# B6（bd t975）：spawn 托管面走 udf skeleton_infra::fx::FxScope（坑约束 5）。
# path 形态同 xray-app-dns（udf-frame 仓内工作副本即改即用；CI 由 fetch-udf 拉料，不锁 rev）。
udf-skeleton-infra = { path = "../udf-frame/skeleton-infra", features = ["tokio"] }
thiserror = { workspace = true }
parking_lot = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tokio = { workspace = true }
async-trait = "0.1"

[dev-dependencies]
# observe_stream 集成测试的事件捕获（P1-5 同款 set_default + with_writer）。
tracing-subscriber = { workspace = true }

