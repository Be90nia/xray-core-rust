[package]
name = "xray-proxy-tuic"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
xray-common = { path = "../xray-common" }
xray-transport = { path = "../xray-transport" }
xray-transport-quic = { path = "../xray-transport-quic" }
xray-app-dispatcher = { path = "../xray-app-dispatcher" }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-rustls = { workspace = true }
rustls = { workspace = true }
quinn = { workspace = true }
quinn-proto = { workspace = true }
bytes = { workspace = true }
uuid = { workspace = true }
tracing = { workspace = true }
parking_lot = { workspace = true }
rcgen = "0.13"

xray-features = { path = "../xray-features" }
xray-buf = { path = "../xray-buf" }
async-trait = { workspace = true }

# P2 批次 D 插件化：L1/L4 面来自装配框架（src/plugin.rs impl xray_frame::Plugin
# 是生产代码——cargo 模型下必须生产依赖；xray-frame 不依赖协议 crate，无环，
# 拍板 P2.1 的"防环"由 xray-frame 单向不引协议 crate 保证）。
xray-frame = { path = "../xray-frame" }
# B6（bd t975）：spawn 托管面走 udf skeleton_infra::fx::FxScope（坑约束 5）。
# path 形态同 xray-app-dns（udf-frame 仓内工作副本即改即用；CI 由 fetch-udf 拉料，不锁 rev）。
udf-skeleton-infra = { path = "../udf-frame/skeleton-infra", features = ["tokio"] }
# plugin.rs 段路由解析（settings → TuicInboundConfig，同规 xray-core
# parse_tuic_inbound_settings）。
serde_json = { workspace = true }
rustls-pemfile = "2"

[dev-dependencies]
xray-proxy-freedom = { path = "../xray-proxy-freedom" }
tokio = { workspace = true, features = ["full", "test-util"] }
rcgen = "0.13"

# bd g3cr: 生产代码零 unwrap（测试代码由 clippy.toml allow-unwrap-in-tests 豁免）
[lints.clippy]
unwrap_used = "deny"
