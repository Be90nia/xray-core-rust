[package]
name = "xray-app-log"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
xray-common = { path = "../xray-common" }
xray-features = { path = "../xray-features" }
xray-proto = { path = "../xray-proto" }
thiserror = { workspace = true }
parking_lot = { workspace = true }
tracing = { workspace = true }
# P1-10-b：分发走 udf logx 多通道（general/access/dns）；log crate 已在树内
# （tracing 依赖），仅为 Level/LevelFilter 类型轴（同 xray-frame B6 口径）。
log = "0.4"
udf-skeleton-infra = { path = "../udf-frame/skeleton-infra", features = ["log"] }
regex = "1"
serde_json = { workspace = true }

[dev-dependencies]
# 通道改道后输出文本快照/比对需要 capture 订阅者（workspace.dependencies 已有条目）。
tracing-subscriber = { workspace = true }

# bd g3cr: 生产代码零 unwrap（测试代码由 clippy.toml allow-unwrap-in-tests 豁免）
[lints.clippy]
unwrap_used = "deny"
