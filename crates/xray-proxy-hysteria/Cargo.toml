[package]
name = "xray-proxy-hysteria"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
xray-common = { path = "../xray-common" }
xray-features = { path = "../xray-features" }
xray-proto = { path = "../xray-proto" }
xray-transport-hysteria = { path = "../xray-transport-hysteria" }
xray-app-dispatcher = { path = "../xray-app-dispatcher" }
xray-xudp = { path = "../xray-xudp" }
xray-transport = { path = "../xray-transport" }
thiserror = { workspace = true }
async-trait = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
parking_lot = { workspace = true }
quinn = { workspace = true }
rand = { workspace = true }
prost = { workspace = true }

# P2 批次 D 插件化：L1/L4 面来自装配框架（src/plugin.rs impl xray_frame::Plugin
# 是生产代码——cargo 模型下必须生产依赖；xray-frame 不依赖协议 crate，无环，
# 拍板 P2.1 的"防环"由 xray-frame 单向不引协议 crate 保证）。
xray-frame = { path = "../xray-frame" }
# Spawned<()> 托管句柄类型（ctx.spawn 返回值存 `_pump` 字段）。
udf-skeleton-infra = { path = "../udf-frame/skeleton-infra", features = ["tokio"] }
# plugin.rs 段路由解析（settings → HysteriaFace 配置面）。
serde_json = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["full", "test-util"] }
bytes = { workspace = true }
rcgen = "0.13"
rustls = { workspace = true, default-features = false, features = ["ring"] }
rustls-pki-types = { workspace = true }
