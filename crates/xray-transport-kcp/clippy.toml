# L3 静态闸（bd a5r4j/lzzja 剩余切片；家族模板 = crates/xray-app-dns/clippy.toml，
# 三禁令全量范本 = crates/xray-common/clippy.toml）：异步托管唯一口 = FxScope/
# PluginContext::spawn（坑约束 #5），时钟唯一源 = skeleton::clock（L3-5）。
# 存量调用按分层登记（避属性海）：≤20 处/文件逐点 #[allow] + 理由归类；
# >20 处/文件文件头 inner allow + 计数与票号；托管裁决见 bd hj3jf（fx 可达即 spawn_tracked，否则逐点登记显式脱管）；上游 drain 缺口见 bd 39hko。
# CI 宽门 clippy -D warnings 使 warn 升级为红线。
# 注：`path` 是被禁方法的 def path，不是源码 glob——glob 写进 path 不报 fatal 但
# 禁令静默无效（xray-frame 探针 1 实测），落地禁用该形态。
# 注：`tokio::spawn` 与 `tokio::task::spawn` 是同 def-id 的两个路径拼写，探针
# 实测二者各自单独登记即覆盖两种调用形态（并列登记去重、每站点仅报一次）。
#
# 注：per-crate clippy.toml 会替换 root 配置（xray-frame 探针 2b 覆盖语义实测），
# root 阈值键在此镜像维护。
# bd g3cr 镜像（root clippy.toml 同键）：unwrap_used 由测试代码
#（cfg(test)/tests/）豁免，生产代码零 unwrap。
allow-unwrap-in-tests = true

disallowed-methods = [
    { path = "tokio::spawn", reason = "裸 spawn 逃逸 FxScope 生命周期记账（坑约束 #5）：一律走 FxScope/PluginContext::spawn；存量调用按分层登记；托管裁决见 bd hj3jf（fx 可达即 spawn_tracked，否则逐点登记显式脱管）" },
    { path = "tokio::task::spawn", reason = "同 tokio::spawn（同 def-id 别名路径拼写，双登记 belt-and-braces；探针实测单独登记即覆盖两种调用形态）" },
    { path = "std::thread::spawn", reason = "裸线程逃逸托管与停机编排（坑约束 #5/#6）：确需 OS 线程的场景逐点 #[allow(clippy::disallowed_methods)] + 理由注释登记" },
    { path = "std::time::Instant::now", reason = "裸时钟源不可注入（时钟唯一源 = skeleton::clock::{Clock, SystemClock, MockClock}）：取时走 clock 端口，测试期才能冻结时间线" },
    { path = "tokio::time::Instant::now", reason = "713x6 时钟唯一源 = skeleton::clock：tokio 虚拟钟预算面（deadline 计算与 tokio::time::pause 确定性对齐）与 std 面禁混换，确需保留时逐点 #[allow] + 语义判定理由登记" },
    { path = "std::time::SystemTime::now", reason = "713x6 时钟唯一源 = skeleton::clock：裸挂钟不可注入，取时走 clock.now_system()；确需保留时逐点 #[allow] + 语义判定理由登记" },
]
