[package]
name = "xray-proxy-wireguard"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
xray-common = { path = "../xray-common" }
xray-features = { path = "../xray-features" }
xray-proto = { path = "../xray-proto" }
xray-app-dispatcher = { path = "../xray-app-dispatcher" }
xray-transport = { path = "../xray-transport" }
xray-xudp = { path = "../xray-xudp" }
xray-app-dns = { path = "../xray-app-dns" }
xray-buf = { path = "../xray-buf" }
xray-app-proxyman = { path = "../xray-app-proxyman" }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
boringtun = { workspace = true }
hex = "0.4"
smoltcp = { workspace = true }
async-trait = { workspace = true }
parking_lot = { workspace = true }
rand = { workspace = true }
bytes = { workspace = true }

# P2 插件化：L1/L4 面来自装配框架（src/plugin.rs impl xray_frame::Plugin 是生产
# 代码——cargo 模型下必须生产依赖；xray-frame 不依赖协议 crate，无环，拍板 P2.1）。
xray-frame = { path = "../xray-frame" }
# B6（bd t975）：spawn 托管面走 udf skeleton_infra::fx::FxScope（坑约束 5）。
# path 形态同 xray-app-dns（udf-frame 仓内工作副本即改即用；CI 由 fetch-udf 拉料，不锁 rev）。
udf-skeleton-infra = { path = "../udf-frame/skeleton-infra", features = ["tokio"] }
# bd 9zxyl：DNS TTL 缓存（udf-std-ext cache::TtlCache）与查询 deadline 时间源
#（udf-skeleton clock 契约）。path 形态同上（udf-frame 仓内工作副本即改即用；
# CI 由 fetch-udf 拉料，不锁 rev）。
udf-skeleton = { path = "../udf-frame/skeleton" }
udf-std-ext = { path = "../udf-frame/std-ext" }
# plugin.rs 段路由解析（settings → DeviceConfig，同规 xray-core
# parse_wireguard_config / parse_wireguard_inbound_config）。
serde_json = { workspace = true }
# Go ParseWireGuardKey：base64 密钥/PSK 归一为 hex（bd ttni 同源）。
base64 = "0.22"

[dev-dependencies]
# Go↔Rust pb 互通 hex fixture 测试用（encode_to_vec/decode 需要 prost::Message trait）
prost = { workspace = true }
