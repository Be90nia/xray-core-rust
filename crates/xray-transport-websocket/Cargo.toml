[package]
name = "xray-transport-websocket"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
xray-buf = { path = "../xray-buf" }
xray-common = { path = "../xray-common" }
xray-transport = { path = "../xray-transport" }
xray-proto = { path = "../xray-proto" }
xray-tls = { path = "../xray-tls" }
serde_json = { workspace = true }
thiserror = { workspace = true }
parking_lot = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
sha1 = "0.10"
base64 = "0.22"
tokio-tungstenite.workspace = true
tokio-rustls = { workspace = true }
socket2 = { workspace = true }
rustls-pki-types.workspace = true
rustls.workspace = true
rustls-pemfile = "2"

futures-util = "0.3"
http = "1"
# ALPN=h2 拒绝服务（wsh2 修复）：Go net/http 对 ws TLS listener 自动装配 h2 层
hyper.workspace = true
hyper-util.workspace = true
http-body-util.workspace = true
bytes.workspace = true

[dev-dependencies]
rcgen = "0.13"
# start_paused（bd cjwc G2 握手超时测试用暂停时钟做毫秒级验证）。
tokio = { workspace = true, features = ["full", "test-util"] }

# bd g3cr: 生产代码零 unwrap（测试代码由 clippy.toml allow-unwrap-in-tests 豁免）
[lints.clippy]
unwrap_used = "deny"
