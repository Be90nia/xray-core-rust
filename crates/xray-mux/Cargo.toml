[package]
name = "xray-mux"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
xray-buf = { path = "../xray-buf" }
xray-common = { path = "../xray-common" }
xray-features = { path = "../xray-features" }
xray-app-dispatcher = { path = "../xray-app-dispatcher" }
xray-transport = { path = "../xray-transport" }
xray-xudp = { path = "../xray-xudp" }
# B6（bd t975）第二波：spawn 托管面走 udf skeleton_infra::fx::FxScope（坑约束 5）。
# path 形态同 xray-app-observatory（udf-frame 仓内工作副本即改即用；CI 由 fetch-udf 拉料，不锁 rev）。
udf-skeleton-infra = { path = "../udf-frame/skeleton-infra", features = ["tokio"] }
parking_lot = { workspace = true }
async-trait = "0.1"
tokio = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["full", "test-util"] }
