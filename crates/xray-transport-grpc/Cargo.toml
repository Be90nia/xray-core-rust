[package]
name = "xray-transport-grpc"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
xray-buf = { path = "../xray-buf" }
xray-common = { path = "../xray-common" }
xray-transport = { path = "../xray-transport" }
xray-proto = { path = "../xray-proto" }
xray-tls = { path = "../xray-tls", optional = true }
# T3.2a 日志收敛：LogFacade（target = xray_frame::transport::grpc）统一入口
xray-frame = { path = "../xray-frame" }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
prost = { workspace = true }
flate2 = { workspace = true }
h2 = "0.4"
http = "1"
bytes = "1"
tokio-rustls = { workspace = true }
rustls = { workspace = true }

[features]
default = ["register"]
register = ["dep:xray-tls"]

[dev-dependencies]
# G8 退避重连确定性测试（tokio::time::pause/advance）
tokio = { workspace = true, features = ["test-util"] }

# bd g3cr: 生产代码零 unwrap（测试代码由 clippy.toml allow-unwrap-in-tests 豁免）
[lints.clippy]
unwrap_used = "deny"
