[package]
name = "xray-proxy-tun"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
xray-common = { path = "../xray-common" }
xray-features = { path = "../xray-features" }
thiserror = { workspace = true }
bytes = { workspace = true }
xray-transport = { path = "../xray-transport" }
xray-app-dispatcher = { path = "../xray-app-dispatcher" }
xray-buf = { path = "../xray-buf" }
xray-proto = { path = "../xray-proto" }
parking_lot = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
serde_json = { workspace = true }
smoltcp = { workspace = true }
async-trait = { workspace = true }

# tun-rs 无 android/ios target（DeviceBuilder/Layer/if_index 未导出；移动端
# 生态 = Android VpnService / iOS NEPacketTunnelProvider 宿主注入流量）。
# 依赖按平台门控，android/ios 走 src/device_stub.rs（保持 TunDevice 类型
# 签名可编译，create/recv/send 返回 Unsupported）。
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tun-rs = { workspace = true }

# Windows WFP 泄漏过滤（票 5std M7）：Fwpm* / iphlpapi LUID / SDDL 安全描述符。
[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
  "Win32_Foundation",
  "Win32_NetworkManagement_Ndis",
  "Win32_NetworkManagement_IpHelper",
  "Win32_NetworkManagement_WindowsFilteringPlatform",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_System_SystemInformation",
  "Win32_System_Rpc",
] }
uuid = { workspace = true }
