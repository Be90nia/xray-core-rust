[package]
name = "xray-common"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
prost = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tokio = { workspace = true }
uuid = { workspace = true }
rand = { workspace = true }
md-5 = "0.10"
sha1 = "0.10"
# 本机网络接口枚举（对应 Go net.InterfaceAddrs/Interfaces/InterfaceByName）。
# git 依赖钉 rev（本机/CI 直连 crates.io index 不稳，github 白名单可达；同 btls 惯例），
# rev = tag v0.15.0 (2026-02-08, PGP verified)
if-addrs = { git = "https://github.com/messense/if-addrs", rev = "3cdbc8b7cfc70a328102bd8b1efdd3408c5d75b2" }
parking_lot = { workspace = true }
xray-buf = { path = "../xray-buf" }
rustls = { workspace = true }
# P1-10-b 日志分发收敛：log::Level/LevelFilter 仅是类型轴引用——log crate 已在
# 树内（tracing 依赖），零新第三方（同 xray-frame B6 取证口径）。
log = "0.4"
# 分发机制单入口 = udf logx 多通道 ChannelRegistry（general/access/dns）。
# memgov：`alloc_site` 站点登记机制（bd 24a5k 换依赖）住 memgov feature 门内，
# 显式列出避免依赖 udf 默认 feature 组合的隐式传递。
udf-skeleton-infra = { path = "../udf-frame/skeleton-infra", features = ["log", "memgov"] }
# bd bf92：antireplay MapFilter 时间源走 skeleton::clock（热路径泛型静态分发）。
udf-skeleton = { path = "../udf-frame/skeleton" }

[dev-dependencies]
# 双写收敛断言需要 capture 订阅者（workspace.dependencies 已有条目）。
tracing-subscriber = { workspace = true }

[lints.clippy]
# bd g3cr / T0.3 基线段（模板同 xray-frame）：生产零 unwrap；
# 测试面豁免由根 clippy.toml allow-unwrap-in-tests 承担。
unwrap_used = "deny"
