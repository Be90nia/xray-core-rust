# L3 静态闸（bd 5t916；家族模板 = crates/xray-app-dns/clippy.toml）：本 crate 是
# L3 闸唯一合法的测试面裸 spawn 出口（src/testing/mod.rs），所以它自己也必须受闸
# ——否则产线文件直接写 tokio::spawn、或把 xray_common::testing::spawn 当裸 spawn
# 用，都无人拦。CI 宽门 clippy -D warnings 使 warn 升级为红线。
# 注：`path` 是被禁方法的 def path，不是源码 glob——glob 写进 path 不报 fatal 但
# 禁令静默无效（xray-frame 探针 1 实测），落地禁用该形态。
#
# 注：per-crate clippy.toml 会替换 root 配置（探针 2b 覆盖语义实测），
# root 阈值键在此镜像维护。
# bd g3cr 镜像（root clippy.toml 同键）：unwrap_used 由测试代码
#（cfg(test)/tests/）豁免，生产代码零 unwrap。
allow-unwrap-in-tests = true

# print/println 不进 disallowed-macros：lib.rs 的
# `#![warn(clippy::print_stdout, clippy::print_stderr)]` +
# `cfg_attr(test, allow(...))` 已覆盖同一面，重复登记只会双报点。
disallowed-methods = [
    { path = "tokio::spawn", reason = "裸 spawn 逃逸 FxScope 生命周期记账（坑约束 #5）：生产面走 PluginContext::spawn，测试面走 xray_common::testing::spawn（本 crate 唯一豁免口 src/testing/mod.rs）；确需豁免时 #[allow(clippy::disallowed_methods)] + 理由注释登记" },
    { path = "std::thread::spawn", reason = "裸线程逃逸托管与停机编排（坑约束 #5/#6）：确需 OS 线程的场景逐点 #[allow(clippy::disallowed_methods)] + 理由注释登记" },
    { path = "std::time::Instant::now", reason = "裸时钟源不可注入（时钟唯一源 = skeleton::clock::{Clock, SystemClock, MockClock}）：取时走 clock 端口，测试期才能冻结时间线" },
]
