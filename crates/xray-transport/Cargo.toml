[package]
name = "xray-transport"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
xray-buf = { path = "../xray-buf" }
xray-common = { path = "../xray-common" }
xray-features = { path = "../xray-features" }
# T3.2a 日志收敛：LogFacade（target = xray_frame::transport）统一入口
xray-frame = { path = "../xray-frame" }
xray-crypto = { path = "../xray-crypto" }
# xdns ResolverConfig 无损承载 Go ResolverProto 的 tls_config/quic_config 生成类型
xray-proto = { path = "../xray-proto" }
# xdns Go wire 互操作测试（proto Config decode/encode）
prost = { workspace = true }
thiserror = "1"
tokio = { workspace = true }
tracing = { workspace = true }
socket2 = { workspace = true }
parking_lot = { workspace = true }
tokio-tungstenite = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
base64 = "0.22"
blake2 = { workspace = true }
rand = { workspace = true }
async-trait = { workspace = true }
futures-util = "0.3"
rustls = { workspace = true }
tokio-rustls = { workspace = true }
ring = { workspace = true }
# realm tlsConfig 自定义 CA + 非 disableSystemRoot 时的信任根（Go getCertPool 系统根
# 的既有 webpki-roots 等价决策；workspace 已有同版本，无新增外部包）
webpki-roots = { workspace = true }
# realm (finalmask NAT 穿透伪装)：HTTP REST + SSE + SHA-256 + hex 编码
# 全仓零 `reqwest::blocking` 调用，删除 blocking feature。
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
sha2 = "0.10"
hex = "0.4"
# xmc (finalmask Minecraft 伪装)：AES-CFB8 + RSA-1024 PKCS1v15 + 确定性素数派生
aes = "0.9"
rsa = "0.9"
# xmc 服务端密码恒时比较（对齐 Go xmc/server.go subtle.ConstantTimeCompare；已在 lockfile 传递依赖）
subtle = { version = "2", default-features = false }
# num-bigint 全仓零引用；rsa 内部使用 num-bigint-dig(BigUint 实现)。
num-traits = "0.2"
num-integer = "0.1"
# checkAddressPortStrategy 的 SRV/TXT 系统解析（Go 用 net.DefaultResolver）
hickory-resolver = { workspace = true }
# B6（bd t975）第二波：spawn 托管面走 udf skeleton_infra::fx::FxScope（坑约束 5）。
# path 形态同 xray-app-observatory（udf-frame 仓内工作副本即改即用；CI 由 fetch-udf 拉料，不锁 rev）。
udf-skeleton-infra = { path = "../udf-frame/skeleton-infra", features = ["tokio"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# realm 端口映射（finalmask/realm/portmap）：NAT-PMP 必须发往默认网关，
# Windows 用 GetIpForwardTable 取路由表（workspace 既有 crate，无新增版本）。
[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
  "Win32_Foundation",
  "Win32_NetworkManagement_IpHelper",
  # nd006：Windows 环回「连接被拒」默认要等一次 SYN 重传（实测 2.03s），Go net.Dial
  # 用 SIO_TCP_INITIAL_RTO 关掉重传 → 需要 WSAIoctl（WinSock）+ 其 OVERLAPPED 形参
  # 类型（Win32_System_IO 门控）。
  "Win32_Networking_WinSock",
  "Win32_System_IO",
] }

[dev-dependencies]
tokio = { workspace = true, features = ["full", "test-util"] }
[features]
default = []
browser-dialer = []

# bd g3cr: 生产代码零 unwrap（测试代码由 clippy.toml allow-unwrap-in-tests 豁免）
[lints.clippy]
unwrap_used = "deny"
