[package]
name = "xray-app-dispatcher"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
xray-common = { path = "../xray-common" }
xray-features = { path = "../xray-features" }
xray-buf = { path = "../xray-buf" }
xray-transport = { path = "../xray-transport" }
xray-proto = { path = "../xray-proto" }
xray-xudp = { path = "../xray-xudp" }
# C 面 R1a（能力收敛方案 §10.1）：SimpleOhm 的 tag→handler 注册表走 udf
# skeleton_infra::memgov::BoundedRegistry（fail-closed insert + 升序确定序 iter）。
# memgov 纯 std 零三方增量；不拖 runtime/pool 默认档（口径同 xray-core）。
# path 形态同各 app crate（udf-frame 仓内工作副本即改即用；CI 由 fetch-udf 拉料）。
udf-skeleton-infra = { path = "../udf-frame/skeleton-infra", default-features = false, features = ["memgov"] }
thiserror.workspace = true
tokio.workspace = true
rand = { workspace = true }
tracing.workspace = true
parking_lot.workspace = true
httparse.workspace = true
ring.workspace = true

[dev-dependencies]
xray-app-stats = { path = "../xray-app-stats" }
# P3-1 S2 双写对照（tests/dual_write_parity.rs）：新旧路径比对新路 = xray-frame
# 查表（dispatch::lookup）；仅测试面消费，生产依赖图零变化。
xray-frame = { path = "../xray-frame" }

[features]
# P3-1 S0/S2 对照基线开关：default 关。S4 后本 flag 只门「对照/记录面」
# （record 环 + in-vivo 对照器 + 注入自检）；出站选择面（影子查表）无条件编译
# ——S4 删旧臂后它是唯一选择路径。
dispatcher-dual-write = []
