[package]
name = "xray-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
xray-core = { path = "../xray-core" }
xray-common = { path = "../xray-common" }
xray-conf = { path = "../xray-conf" }
xray-proto = { path = "../xray-proto", features = ["grpc-client"] }
xray-tls = { path = "../xray-tls" }
thiserror = { workspace = true }
clap = { version = "4", features = ["derive", "env"] }
tokio = { workspace = true }
tonic = { workspace = true }
tonic-prost = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true }
prost = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
base64 = "0.22"
blake3 = "1"
rand = { workspace = true }
x25519-dalek = { version = "2.0", features = ["static_secrets"] }
# PQ 密钥生成（bd a1h）：ml-kem 与 xray-proxy-vless 对齐；ml-dsa 无 workspace 现成实现，
# 预授权引入 RustCrypto 官方 crate
ml-kem = "0.3"
ml-dsa = { version = "0.1", default-features = false, features = ["alloc"] }

[dev-dependencies]
tempfile = "3"
