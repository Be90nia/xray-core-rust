[package]
name = "xray-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
xray-core = { path = "../xray-core" }
# T3.2a 日志收敛：LogFacade（target = xray_frame::cli）统一入口
xray-frame = { path = "../xray-frame" }
xray-transport-kcp = { path = "../xray-transport-kcp" }
xray-common = { path = "../xray-common" }
xray-conf = { path = "../xray-conf" }
xray-proto = { path = "../xray-proto", features = ["grpc-client"] }
xray-tls = { path = "../xray-tls" }
thiserror = { workspace = true }
clap = { version = "4", features = ["derive", "env"] }
tokio = { workspace = true }
tonic = { workspace = true }
tonic-prost = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true }
prost = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
base64 = "0.22"
# base64 子命令 -gzip：Go common/base64 用 stdlib compress/gzip；flate2 为 workspace 既有依赖（零新 crate 入图）
flate2 = { workspace = true }
blake3 = "1"
rand = { workspace = true }
x25519-dalek = { version = "2.0", features = ["static_secrets"] }
# tls ping：tokio-rustls 握手 + x509-parser 证书字段提取
rustls = { workspace = true }
tokio-rustls = { workspace = true }
x509-parser = "0.18"
rustls-pemfile = "2"
rustls-pki-types = "1"
# PQ 密钥生成（bd a1h）：ml-kem 与 xray-proxy-vless 对齐；ml-dsa 无 workspace 现成实现，
# 预授权引入 RustCrypto 官方 crate
ml-kem = "0.3"
ml-dsa = { version = "0.1", default-features = false, features = ["alloc"] }
# bd uf2p: mimalloc 全局分配器。feature 默认开启（发行构建零参数吃到收益）；
# A/B 回退用 --no-default-features。仅影响 xray bin，lib/测试不受影响。
mimalloc = { version = "0.1", optional = true }
# B2 T2.1 双写对照长跑取证：把 dispatcher 的 dispatcher-dual-write 开关转发到
# 发行二进制（关闭时依赖不参与、生产路径零新增代码）。
xray-app-dispatcher = { path = "../xray-app-dispatcher", optional = true }
# B5 第二步 handler 桥（framework-assembly 拉起）：DispatchHandler/Link/xray_buf io
# trait 三面均已在 default 闭包（xray-core 非可选依赖），optional 仅控命名空间。
xray-transport = { path = "../xray-transport", optional = true }
xray-buf = { path = "../xray-buf", optional = true }
# B5 第三步：协议插件族（P2 批次 A/B 已插件化的 15 族；ss 未插件化故不在列）。
# 均已在 default 闭包（xray-core 依赖），optional 仅控命名空间，default 依赖图零变化。
xray-proxy-socks = { path = "../xray-proxy-socks", optional = true }
xray-proxy-http = { path = "../xray-proxy-http", optional = true }
xray-proxy-dokodemo = { path = "../xray-proxy-dokodemo", optional = true }
xray-proxy-trojan = { path = "../xray-proxy-trojan", optional = true }
xray-proxy-tuic = { path = "../xray-proxy-tuic", optional = true }
xray-proxy-anytls = { path = "../xray-proxy-anytls", optional = true }
xray-proxy-hysteria = { path = "../xray-proxy-hysteria", optional = true }
xray-proxy-wireguard = { path = "../xray-proxy-wireguard", optional = true }
xray-proxy-tun = { path = "../xray-proxy-tun", optional = true }
xray-proxy-dns = { path = "../xray-proxy-dns", optional = true }
xray-proxy-vless = { path = "../xray-proxy-vless", optional = true }
xray-proxy-vmess = { path = "../xray-proxy-vmess", optional = true }
xray-proxy-freedom = { path = "../xray-proxy-freedom", optional = true }
xray-proxy-blackhole = { path = "../xray-proxy-blackhole", optional = true }
xray-proxy-loopback = { path = "../xray-proxy-loopback", optional = true }
xray-proxy-ss = { path = "../xray-proxy-ss", optional = true }

[features]
default = ["mimalloc"]
mimalloc = ["dep:mimalloc"]
dual-write = ["dep:xray-app-dispatcher", "xray-app-dispatcher/dispatcher-dual-write"]
# B5：xray-frame `Framework` 组合根启动路径 + handler 桥（默认关）。xray-frame 已是
# 非 optional 依赖（T3.2a LogFacade），本 feature 只门控新路径代码（src/framework.rs
# + run.rs 分叉），关闭时依赖图与生产行为零变化。
framework-assembly = [
    "xray-core/framework-assembly",
    "dep:xray-app-dispatcher",
    "dep:xray-transport",
    "dep:xray-buf",
    "dep:xray-proxy-socks",
    "dep:xray-proxy-http",
    "dep:xray-proxy-dokodemo",
    "dep:xray-proxy-trojan",
    "dep:xray-proxy-tuic",
    "dep:xray-proxy-anytls",
    "dep:xray-proxy-hysteria",
    "dep:xray-proxy-wireguard",
    "dep:xray-proxy-tun",
    "dep:xray-proxy-dns",
    "dep:xray-proxy-vless",
    "dep:xray-proxy-vmess",
    "dep:xray-proxy-freedom",
    "dep:xray-proxy-blackhole",
    "dep:xray-proxy-loopback",
    "dep:xray-proxy-ss",
]

[dev-dependencies]
tempfile = "3"

# bd g3cr: 生产代码零 unwrap（测试代码由 clippy.toml allow-unwrap-in-tests 豁免）
[lints.clippy]
unwrap_used = "deny"
