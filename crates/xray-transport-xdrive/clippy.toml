# L3 静态闸（bd a5r4j/lzzja 剩余切片；家族模板 = crates/xray-transport-websocket/clippy.toml）：
# 异步托管唯一口 = FxScope/ComponentScope::spawn（坑约束 #5，§3.5.6 spawn 三分类），
# 时钟唯一源 = skeleton::clock（compat::clock() 进程级取时）。
# 注：per-crate clippy.toml 会替换 root 配置（xray-frame 探针 2b 覆盖语义实测），
# root 阈值键在此镜像维护（逐字镜像 websocket 件，勿本地增删键）。
# bd g3cr 镜像（root clippy.toml 同键）：unwrap_used 由测试代码
#（cfg(test)/tests/）豁免，生产代码零 unwrap。
allow-unwrap-in-tests = true

disallowed-methods = [
    { path = "tokio::spawn", reason = "裸 spawn 逃逸 FxScope 生命周期记账（坑约束 #5）：一律走 FxScope/ComponentScope::spawn；存量调用按分层登记；托管裁决见 bd hj3jf（fx 可达即 spawn_tracked，否则逐点登记显式脱管）" },
    { path = "std::thread::spawn", reason = "裸线程逃逸托管与停机编排（坑约束 #5/#6）：确需 OS 线程的场景逐点 #[allow(clippy::disallowed_methods)] + 理由注释登记" },
    { path = "std::time::Instant::now", reason = "裸时钟源不可注入（时钟唯一源 = skeleton::clock::{Clock, SystemClock, MockClock}）：取时走 clock 端口，测试期才能冻结时间线" },
    { path = "tokio::time::Instant::now", reason = "时钟唯一源 = skeleton::clock::{Clock}：ctx 可达走 ctx.clock()，不可达走 xray_frame::compat::clock()；tokio 虚拟钟预算面与 std 面禁混换，确需保留时逐点 #[allow(clippy::disallowed_methods)] + 理由注释登记（D8 补齐）" },
    { path = "std::time::SystemTime::now", reason = "时钟唯一源 = skeleton::clock::{Clock}：ctx 可达走 ctx.clock()，不可达走 xray_frame::compat::clock()；裸挂钟不可注入，取时走 clock.now_system()，确需保留时逐点 #[allow(clippy::disallowed_methods)] + 理由注释登记（D8 补齐）" },
]
