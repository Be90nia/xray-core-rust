[package]
name = "xray-proxy-vless"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
xray-common = { path = "../xray-common" }
xray-features = { path = "../xray-features" }
xray-proto = { path = "../xray-proto" }
xray-buf = { path = "../xray-buf" }
xray-transport = { path = "../xray-transport" }
xray-app-dispatcher = { path = "../xray-app-dispatcher" }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
parking_lot = { workspace = true }
rand = { workspace = true }
rand_core = "0.9"
bytes = { workspace = true }
prost = { workspace = true }
# VLESS encryption（对齐 xray-reality + xray-crypto 的 RustCrypto 生态版本）
ml-kem = { version = "0.3", features = ["getrandom"] }
blake3 = "1.8"
x25519-dalek = { version = "2.0", features = ["static_secrets"] }
aes-gcm = "0.11.0-rc.4"
chacha20poly1305 = "0.11.0-rc.3"
# CTR stream (relay chain hash32 + XorConn) — 与 xray-crypto 对齐
aes = "0.9"
ctr = "0.10"

[dev-dependencies]
xray-xudp = { path = "../xray-xudp" }
tokio = { workspace = true, features = ["full", "test-util"] }
xray-tls = { path = "../xray-tls" }
tokio-tungstenite = { workspace = true }
futures-util = "0.3"
xray-proxy-freedom = { path = "../xray-proxy-freedom" }
