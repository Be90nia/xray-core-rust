[package]
name = "xray-proxy-vless"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
xray-common = { path = "../xray-common" }
xray-features = { path = "../xray-features" }
xray-proto = { path = "../xray-proto" }
xray-buf = { path = "../xray-buf" }
xray-transport = { path = "../xray-transport" }
xray-app-dispatcher = { path = "../xray-app-dispatcher" }
# P2 批次 B 插件化：L1/L4 面来自装配框架（src/plugin.rs impl xray_frame::Plugin
# 是生产代码——cargo 模型下必须生产依赖；xray-frame 不依赖协议 crate，无环）。
xray-frame = { path = "../xray-frame" }
# B6（bd t975）：spawn 托管面走 udf skeleton_infra::fx::FxScope（坑约束 5）。
# path 形态同 xray-app-dns（udf-frame 仓内工作副本即改即用；CI 由 fetch-udf 拉料，不锁 rev）。
udf-skeleton-infra = { path = "../udf-frame/skeleton-infra", features = ["tokio"] }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
parking_lot = { workspace = true }
rand = { workspace = true }
rand_core = "0.9"
bytes = { workspace = true }
prost = { workspace = true }
# VLESS encryption（对齐 xray-reality + xray-crypto 的 RustCrypto 生态版本）
ml-kem = { version = "0.3", features = ["getrandom"] }
blake3 = "1.8"
x25519-dalek = { version = "2.0", features = ["static_secrets"] }
aes-gcm = "0.11.0-rc.4"
chacha20poly1305 = "0.11.0-rc.3"
# CTR stream (relay chain hash32 + XorConn) — 与 xray-crypto 对齐
aes = "0.9"
ctr = "0.10"
base64 = "0.22"
# plugin.rs 段路由解析（settings → VlessFace，同规 xray-core parse_vless_config /
# build_vless_validator / build_vless_decryption / build_vless_fallbacks）。
serde_json = { workspace = true }

[dev-dependencies]
xray-xudp = { path = "../xray-xudp" }

xray-tls = { path = "../xray-tls" }
tokio-tungstenite = { workspace = true }
futures-util = "0.3"
xray-proxy-freedom = { path = "../xray-proxy-freedom" }
# write_padding_fragments 的 start_paused 虚拟时钟测试
tokio = { workspace = true, features = ["test-util"] }
# vision DIRECT/END commit-record 全栈回归实验室（真 rustls + rcgen 自签证书）
tokio-rustls = { workspace = true }
rustls = { workspace = true }
rcgen = "0.13"

# bd g3cr: 生产代码零 unwrap（测试代码由 clippy.toml allow-unwrap-in-tests 豁免）
[lints.clippy]
unwrap_used = "deny"
