[package]
name = "xray-proxy-dns"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
xray-common = { path = "../xray-common" }
xray-features = { path = "../xray-features" }
xray-proto = { path = "../xray-proto" }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
xray-geodata = { path = "../xray-geodata" }
hickory-resolver = { workspace = true }
async-trait = { workspace = true }
# P2 批次 D 插件化：L1/L4 面来自装配框架（src/plugin.rs impl xray_frame::Plugin
# 是生产代码——cargo 模型下必须生产依赖；xray-frame 不依赖协议 crate，无环，
# 拍板 P2.1 的"防环"由 xray-frame 单向不引协议 crate 保证）。
xray-frame = { path = "../xray-frame" }
# B6（bd t975）：spawn 托管面走 udf skeleton_infra::fx::FxScope（坑约束 5）。
# path 形态同 xray-app-dns（udf-frame 仓内工作副本即改即用；CI 由 fetch-udf 拉料，不锁 rev）。
udf-skeleton-infra = { path = "../udf-frame/skeleton-infra", features = ["tokio"] }
# plugin.rs 段路由解析（settings → Config，同规 xray-core build_dns_outbound_config）。
serde_json = { workspace = true }

[dev-dependencies]
hickory-resolver = { workspace = true }
tokio = { workspace = true, features = ["full", "test-util"] }
# 伪造 geosite.dat fixture 编码（GeoSiteList::encode_to_vec）
prost = { workspace = true }
