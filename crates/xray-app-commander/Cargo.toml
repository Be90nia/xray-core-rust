[package]
name = "xray-app-commander"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
xray-common = { path = "../xray-common" }
xray-features = { path = "../xray-features" }
xray-proto = { path = "../xray-proto", features = ["grpc-server"] }
xray-app-stats = { path = "../xray-app-stats" }
xray-app-router = { path = "../xray-app-router" }
xray-app-log = { path = "../xray-app-log" }
xray-app-observatory = { path = "../xray-app-observatory" }
xray-app-proxyman = { path = "../xray-app-proxyman" }
xray-app-dispatcher = { path = "../xray-app-dispatcher" }
xray-transport = { path = "../xray-transport" }
# B6（bd t975）：spawn 托管面走 udf skeleton_infra::fx::FxScope（坑约束 5）。
# path 形态同 xray-app-dns（udf-frame 仓内工作副本即改即用；CI 由 fetch-udf 拉料，不锁 rev）。
udf-skeleton-infra = { path = "../udf-frame/skeleton-infra", features = ["tokio"] }
thiserror = { workspace = true }
parking_lot = { workspace = true }
tracing = { workspace = true }
tokio = { workspace = true, features = ["io-util", "sync", "rt", "net"] }
async-trait = { workspace = true }
tonic = { workspace = true }
tonic-reflection = { workspace = true }
prost = { workspace = true }
futures = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["full"] }
xray-proto = { path = "../xray-proto", features = ["grpc-client"] }
xray-buf = { path = "../xray-buf" }
hyper-util = { workspace = true }
