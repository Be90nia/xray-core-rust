[package]
name = "xray-proxy-vmess"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
xray-common = { path = "../xray-common" }
xray-features = { path = "../xray-features" }
xray-proto = { path = "../xray-proto" }
xray-buf = { path = "../xray-buf" }
xray-crypto = { path = "../xray-crypto" }
xray-app-dispatcher = { path = "../xray-app-dispatcher" }
xray-transport = { path = "../xray-transport" }
# P2 批次 B 插件化：L1/L4 面来自装配框架（src/plugin.rs impl xray_frame::Plugin
# 是生产代码——cargo 模型下必须生产依赖；xray-frame 不依赖协议 crate，无环）。
xray-frame = { path = "../xray-frame" }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
parking_lot = { workspace = true }
bytes = { workspace = true }
prost = { workspace = true }
async-trait = { workspace = true }

# 加密原语：HMAC-SHA256（KDF）、SHA256（body key 派生）、MD5（chacha key 派生）、
# SHAKE128（chunk size padding）、CRC32-IEEE（AuthID）、FNV1a（命令认证）
hmac = "0.12"
sha2 = "0.10"
md-5 = "0.10"
sha3 = "0.10"
crc32fast = "1"
fnv = "1"
# AES 单块加密（CreateAuthID 用）
aes = "0.8"
rand = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["full", "test-util"] }
xray-tls = { path = "../xray-tls" }
tokio-tungstenite = { workspace = true }
futures-util = "0.3"
xray-proxy-freedom = { path = "../xray-proxy-freedom" }
