[package]
name = "xray-proxy-anytls"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
xray-common = { path = "../xray-common" }
xray-transport = { path = "../xray-transport" }
xray-buf = { path = "../xray-buf" }
xray-app-dispatcher = { path = "../xray-app-dispatcher" }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-rustls = { workspace = true }
rustls = { workspace = true }
anytls = { workspace = true }
sha2 = "0.10"
tracing = { workspace = true }
xray-features = { path = "../xray-features" }
# P2 批次 D 插件化：L1/L4 面来自装配框架（src/plugin.rs impl xray_frame::Plugin
# 是生产代码——cargo 模型下必须生产依赖；xray-frame 不依赖协议 crate，无环）。
xray-frame = { path = "../xray-frame" }
# B6（bd t975）：spawn 托管面走 udf skeleton_infra::fx::FxScope（坑约束 5）。
# path 形态同 xray-app-dns（udf-frame 仓内工作副本即改即用；CI 由 fetch-udf 拉料，不锁 rev）。
udf-skeleton-infra = { path = "../udf-frame/skeleton-infra", features = ["tokio"] }
# plugin.rs 段路由 JSON 解析（settings.password）。
serde_json = { workspace = true }
async-trait = { workspace = true }
parking_lot = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["full", "test-util"] }
rcgen = "0.13"
xray-buf = { path = "../xray-buf" }
xray-app-dispatcher = { path = "../xray-app-dispatcher" }
xray-proxy-freedom = { path = "../xray-proxy-freedom" }
