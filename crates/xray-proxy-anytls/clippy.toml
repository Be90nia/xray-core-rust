# P0-6 L3 静态闸（模板镜像 crates/xray-frame/clippy.toml）：异步托管唯一口 =
# PluginContext::spawn（透传 skeleton_infra::fx::FxScope），裸 spawn 失管（坑约束 #5）。
#
# 注：per-crate clippy.toml 会替换 root 配置（探针 2b 覆盖语义实测），
# root 阈值键在此镜像维护。
allow-unwrap-in-tests = true

disallowed-methods = [
    { path = "tokio::spawn", reason = "裸 spawn 逃逸 FxScope 生命周期记账（坑约束 #5）：一律走 PluginContext::spawn；确需豁免时 #[allow(clippy::disallowed_methods)] + 理由注释登记" },
    { path = "std::thread::spawn", reason = "裸 OS 线程逃逸 FxScope 生命周期记账（坑约束 #5）：一律走 PluginContext::spawn；确需豁免时 #[allow(clippy::disallowed_methods)] + 理由注释登记" },
]
disallowed-macros = [
    { path = "std::println", reason = "禁直印 stdout：日志走 LogFacade（PluginContext::log，P0-7 target 规范）" },
    { path = "std::eprintln", reason = "禁直印 stderr：日志走 LogFacade（PluginContext::log，P0-7 target 规范）" },
]
