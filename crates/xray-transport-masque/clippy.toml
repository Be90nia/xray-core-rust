# L3 静态闸（bd a5r4j/lzzja 家族模板，对齐 xray-transport-splithttp 同款；票 txmhr）：
# 异步托管唯一口 = FxScope/PluginContext::spawn（坑约束 #5）。本 crate 是 h2 胶囊
# 传输层：读泵/写泵/h2 连接驱动任务全部落在数据面（坑约束⑫ 热路径零改动），按
# §3.5.6 ②类「数据面逐包泵」逐点 #[allow(clippy::disallowed_methods)] + 实义理由
# 登记；hub 侧组件级任务（accept 循环 / 握手任务 / upgrade 泵）一律走 hub 自己的
# ComponentScope（关闸档），不得裸 spawn。
# 注：per-crate clippy.toml 会替换 root 配置——root 键（allow-unwrap-in-tests）在此
# 镜像维护（unwrap_used 由本 crate Cargo.toml [lints.clippy] 把守）。
# 注：`path` 是被禁方法的 def path；`tokio::spawn` 单条即拦截两种书写形态
# （tokio::spawn = tokio::task::spawn 的 re-export，探针实证）。
allow-unwrap-in-tests = true

disallowed-methods = [
    { path = "tokio::spawn", reason = "裸 spawn 逃逸 FxScope 生命周期记账（坑约束 #5）：一律走 FxScope/PluginContext::spawn；本 crate 为 h2 胶囊传输层（读/写泵 + h2 连接驱动，数据面坑约束⑫），按 §3.5.6 ②类「数据面逐包泵」逐点 #[allow(clippy::disallowed_methods)] + 实义理由登记；组件级任务走 hub 的 ComponentScope（bd hj3jf）" },
    { path = "tokio::task::spawn", reason = "同 tokio::spawn（同 def-id 别名路径拼写，双登记 belt-and-braces；探针实测单独登记即覆盖两种调用形态）" },
    { path = "std::thread::spawn", reason = "裸线程逃逸托管与停机编排（坑约束 #5/#6）：确需 OS 线程的场景逐点 #[allow(clippy::disallowed_methods)] + 理由注释登记" },
]
