[package]
name = "xray-transport-masque"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

# MASQUE transport：RFC 9484 CONNECT-IP over HTTP/2 胶囊隧道
# （对应 Go transport/internet/masque/ + transport/internet/masque/connectip/）。
# B2 批次依赖面：hyper/hyper-util/h2 绑定（B0.1 规划面）、xray-tls（TLS(ALPN=h2)
# 同 splithttp 调用序）、xray-frame（LOG 门面）；h3 不引（规划 §7 R11 押后）。
[dependencies]
xray-common = { path = "../xray-common" }
xray-transport = { path = "../xray-transport" }
xray-proto = { path = "../xray-proto" }
xray-tls = { path = "../xray-tls" }
# B2 日志门面：LogFacade（target = transport::masque），splithttp/grpc 同款
xray-frame = { path = "../xray-frame" }
thiserror = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
# B0 U1 spike + B2 h2 绑定（dev 面随生产依赖继承）
hyper = { workspace = true }
hyper-util = { workspace = true }
http-body-util = { workspace = true }
bytes = { workspace = true }
tokio = { workspace = true }
# Basic 认证头（user/pass → Authorization；Go transport_method.go:877-880 同款）
base64 = "0.22"
# B4 hub：服务端 TLS acceptor（tokio_rustls::TlsAcceptor；xray-tls 产 rustls ServerConfig）
tokio-rustls = { workspace = true }
# WARP 变体（bd 2m30a）：Go `warp.go warpCertificate` 用既有 WARP 私钥现场签自签证书。
# rcgen 本是本 crate dev-dep（xray-tls 生产依赖同款、Cargo.lock 内既有），生产面复用
# 即免新增第三方；`time` 同源（xray-tls 依赖同版本），只为 NotBefore/NotAfter = now±。
rcgen = "0.13"
time = { version = "0.3", default-features = false, features = ["std"] }
# WARP 客户端证书 + SPKI pin 验证器（`warp.rs`）；tokio-rustls 已间接依赖同一 rustls。
rustls = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
# bd anygg G2 L2（network:"masque" 承载 VLESS 真实字节往返；workspace path 依赖，
# 零新三方）：真实 proxy 层 users 源（serve() → 共享 gate 注册）+ 真 vless 双端
# + freedom 桥。dev 环允许（xray-core dev-dep xray-cli 同款先例）。
xray-app-dispatcher = { path = "../xray-app-dispatcher" }
xray-proxy-freedom = { path = "../xray-proxy-freedom" }
xray-proxy-masque = { path = "../xray-proxy-masque" }
xray-proxy-vless = { path = "../xray-proxy-vless" }

# bd g3cr：生产代码零 unwrap（测试代码由 root clippy.toml allow-unwrap-in-tests 豁免）
[lints.clippy]
unwrap_used = "warn"
