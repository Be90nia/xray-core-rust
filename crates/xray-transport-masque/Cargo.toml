[package]
name = "xray-transport-masque"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

# MASQUE transport：RFC 9484 CONNECT-IP over HTTP/2 胶囊隧道
# （对应 Go transport/internet/masque/ + transport/internet/masque/connectip/）。
# B0+B1 批次依赖面只含本批实际消费件；B2（h2 绑定）起再补 hyper/hyper-util/
# xray-tls/xray-frame/xray-buf（规划 §5 B0.1 依赖面按批次落地）。
[dependencies]
xray-common = { path = "../xray-common" }
xray-transport = { path = "../xray-transport" }
xray-proto = { path = "../xray-proto" }
thiserror = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
# Basic 认证头（user/pass → Authorization；Go transport_method.go:877-880 同款）
base64 = "0.22"

# B0 U1 spike + B1 golden/config 测试面（B2 起 hyper/hyper-util 上移生产依赖）
[dev-dependencies]
tokio = { workspace = true }
hyper = { workspace = true }
hyper-util = { workspace = true }
http-body-util = { workspace = true }
bytes = { workspace = true }

# bd g3cr：生产代码零 unwrap（测试代码由 root clippy.toml allow-unwrap-in-tests 豁免）
[lints.clippy]
unwrap_used = "warn"
