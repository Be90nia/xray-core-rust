# 数据面分配纪律（oracle-framing-arch Phase 0 护栏）：禁热路径扁平化拷贝。
# 生效范围：本 crate 生产代码；测试代码经 src/lib.rs 顶部 cfg_attr(test, allow)
# 统一豁免（断言扁平化属测试便利）。CI 宽门 clippy -D warnings 使其成为红线。
# 注：slice 方法路径的 root 段必须是 primitive 关键字 `slice`（clippy
# find_primitive_impls 机制），写 alloc::slice::/std::slice:: 反而解析不到。
#
# 注：per-crate clippy.toml 会替换 root 配置，root 阈值键在此镜像维护。
cognitive-complexity-threshold = 30
type-complexity-threshold = 300

# 已知未覆盖角落（后续批次补）：
# - to_owned() / .collect::<Vec<_>>() / Vec::from(&buf[..]) 等价分配形态
# - grpc 编码层双拷贝、vless 握手期 to_vec（冷路径，暂不适用）
# - Vec::new 后逐段 extend（语义上等价 to_vec，静态识别需新 lint）
disallowed-methods = [
    { path = "tokio::spawn", reason = "裸 spawn 逃逸 FxScope 生命周期记账（坑约束 #5）：一律走 PluginContext::spawn；确需豁免时 #[allow(clippy::disallowed_methods)] + 理由登记（测试面经 src/lib.rs 顶部 cfg_attr(test) 统一豁免）" },
    { path = "std::thread::spawn", reason = "裸线程逃逸托管与停机编排（坑约束 #5/#6）：确需 OS 线程的场景逐点 #[allow(clippy::disallowed_methods)] + 理由登记" },
    { path = "slice::to_vec", reason = "数据面禁 to_vec 扁平化堆分配：热路径用池化 Buffer/MultiBuffer 传递；确需扁平化时 #[allow(clippy::disallowed_methods)] + 理由注释登记" },
    { path = "xray_buf::multi::MultiBuffer::to_vec", reason = "数据面禁 MultiBuffer 整链扁平化：确需快照时 #[allow] + 理由注释登记" },
    { path = "std::time::Instant::now", reason = "数据面 crate 不持时钟面（零 skeleton 依赖纪律）：时限/时戳语义由上层注入；确需时逐点 #[allow(clippy::disallowed_methods)] + 理由登记" },
    { path = "tokio::time::Instant::now", reason = "同上（数据面零时钟纪律）：确需时逐点 #[allow] + 理由登记" },
    { path = "std::time::SystemTime::now", reason = "同上（数据面零时钟纪律）：现存唯一登记点 = alloc.rs now_ms 池惰性清扫锚" },
]
