[package]
name = "xray-app-geodata"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
xray-common = { path = "../xray-common" }
xray-features = { path = "../xray-features" }
xray-proto = { path = "../xray-proto" }
xray-geodata = { path = "../xray-geodata" }
# P1-2 互喂试点：启动期 geodata 加载走 udf PooledThreadPool（默认 feature 已含
# pool→memgov，PooledThreadPool 为根导出；零新增第三方依赖）。
udf-skeleton-infra = { path = "../udf-frame/skeleton-infra" }
# B6（bd vmaz）：swap/回滚语义收敛到装配层唯一实现 xray_frame::reload（禁本地
# 第二份 stage/swap/tx 实现）。依赖方向 = 血肉→骨架（xray-frame 零 xray-app
# 依赖，无环）；日志走其 LogFacade（坑约束 10）。
xray-frame = { path = "../xray-frame" }
thiserror = { workspace = true }
parking_lot = { workspace = true }
tracing = { workspace = true }

# pn8e: HTTPS downloader（GitHub raw 等常规 https 源自动更新）。
# 默认开：rustls + webpki-roots 走 std TCP 同步握手。ponytail: 后续可加 custom
# CA / pinned cert（Go GeodataConfig 暂未支持；纯 webpki 已覆盖 GitHub）。
rustls = { workspace = true }
rustls-pki-types = { workspace = true }
webpki-roots = { workspace = true }

[dev-dependencies]
xray-geodata = { path = "../xray-geodata" }
prost = { workspace = true }

[lints.clippy]
# bd g3cr / T0.3 基线段（模板同 xray-frame）：生产零 unwrap；
# 测试面豁免由根 clippy.toml allow-unwrap-in-tests 承担。
unwrap_used = "deny"
