[package]
name = "xray-app-dns"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
xray-common = { path = "../xray-common" }
xray-features = { path = "../xray-features" }
xray-geodata = { path = "../xray-geodata" }
async-trait = "0.1"
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
parking_lot.workspace = true
uuid.workspace = true
# bd b2qdu：fakedns LRU 走 udf std_ext::cache::LruCache（外购 lru 已删）。
# path 形态同 udf-skeleton（udf-frame 仓内工作副本即改即用；CI 由 fetch-udf 拉料，不锁 rev）。
udf-std-ext = { path = "../udf-frame/std-ext" }
hickory-proto.workspace = true
hickory-resolver.workspace = true
ipnet = "2"
xray-tls = { path = "../xray-tls" }
xray-transport = { path = "../xray-transport" }
xray-buf = { path = "../xray-buf" }
# P1-12：TTL/stale 时间源走 udf skeleton::clock 契约。path 形态同 xray-frame
#（udf-frame 仓内工作副本即改即用；CI 由 fetch-udf 拉料，不锁 rev）。
udf-skeleton = { path = "../udf-frame/skeleton" }
# P1-11：spawn 托管面走 udf skeleton_infra::fx::FxScope（坑约束 5）。path 形态同
# udf-skeleton（udf-frame 仓内工作副本即改即用；CI 由 fetch-udf 拉料，不锁 rev）。
udf-skeleton-infra = { path = "../udf-frame/skeleton-infra", features = ["tokio"] }
# W4 面 3（能力收敛方案 §2）：tokio 虚拟钟预算统一走 xray_frame::deadline::Budget
#（Budget::tokio() 保 advance 语义；依赖方向 = 血肉→骨架，xray-frame 零 app 依赖，无环）。
xray-frame = { path = "../xray-frame" }
tokio-rustls.workspace = true
h2.workspace = true
http.workspace = true
bytes.workspace = true
quinn.workspace = true
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
rcgen = "0.13"
# tokio::time::pause/advance（G13 缺省 5s 兜底的 pause 测试）需要 test-util；
# 仅测试构建生效，生产构建不含 dev-dependencies。
tokio = { workspace = true, features = ["test-util"] }

# bd g3cr: 生产代码零 unwrap（测试代码由 clippy.toml allow-unwrap-in-tests 豁免）
[lints.clippy]
unwrap_used = "deny"
