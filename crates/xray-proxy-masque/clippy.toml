# L3 静态闸（对齐 xray-transport-masque 同款；B4 派单）：
# 异步托管唯一口 = FxScope/PluginContext::spawn（坑约束 #5）。per-crate
# clippy.toml 会替换 root 配置——root 键（allow-unwrap-in-tests）在此镜像维护。
allow-unwrap-in-tests = true

disallowed-methods = [
    { path = "tokio::spawn", reason = "裸 spawn 逃逸 FxScope 生命周期记账（坑约束 #5）：一律走 FxScope/PluginContext::spawn / ComponentScope；确需脱管的站点逐点 #[allow(clippy::disallowed_methods)] + ①类理由登记（bd xosi9）" },
    { path = "tokio::task::spawn", reason = "同 tokio::spawn（同 def-id 别名路径，双登记 belt-and-braces）" },
    { path = "std::thread::spawn", reason = "裸线程逃逸托管与停机编排（坑约束 #5/#6）：确需 OS 线程的场景逐点 #[allow] + 理由注释登记" },
]
