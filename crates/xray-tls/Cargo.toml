[package]
name = "xray-tls"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
parking_lot = { workspace = true }
xray-common = { path = "../xray-common" }
xray-proto = { path = "../xray-proto" }
xray-transport = { path = "../xray-transport" }
thiserror = { workspace = true }
sha2 = "0.10"
hex = "0.4"
subtle = "2"

# 标准 rustls TLS 握手 (uTLS 指纹伪装待 REALITY 任务再评估 watfaq-rustls git 依赖)
rustls = { workspace = true }
tokio-rustls = { workspace = true }
webpki-roots = { workspace = true }
# useSystemCA（Go loadCA(true) → x509.SystemCertPool）读 OS 信任库；已在 Cargo.lock
rustls-native-certs = "0.8"
rustls-pki-types = { workspace = true }

# OCSP stapling（对应 Go crypto/x509 + ocsp；自动获取并装订 OCSP 响应到 TLS 握手）
# bd yyoy9(a)：唯一消费者 `src/ocsp_stapling.rs` 整体 gated（feature default=[]，
# 全仓无启用点）⇒ 声明为 optional，避免恒编译进 supply-chain 面。
ocsp-stapler = { workspace = true, optional = true }
rustls-pemfile = "2"

# uTLS 指纹伪造 (btls BoringSSL 绑定)
btls = { workspace = true }
btls-sys = { workspace = true }
tokio-btls = { workspace = true }
foreign-types = { workspace = true }

# 日志 (u_client fallback log)
tracing = { workspace = true }
tokio = { workspace = true }
serde_json = { workspace = true }
# 时钟唯一源 = udf skeleton::clock（L3-5；bd 39hko W3a 底层接线）
udf-skeleton = { path = "../udf-frame/skeleton" }
# 证书热重载（bd 5ctu1）：快照无锁读 + 原子整体换 `Arc` 走 xray-frame `HotSlot`
#（bd 9u35o 交付件），周期任务走其 `scope::ComponentScope` 托管。禁自造 arc-swap
# 包装 / 裸 spawn。依赖方向 = 血肉→骨架（xray-frame 不依赖本 crate，无环）。
xray-frame = { path = "../xray-frame" }
# TLS session cache 宿主 = udf std_ext::cache::SyncTtlCache（容量 + TTL 双界，
# bd nzli4/nzli6）。path 形态同其它消费方（udf-frame 仓内工作副本即改即用）。
udf-std-ext = { path = "../udf-frame/std-ext" }
time = { version = "0.3", default-features = false, features = ["std"] }
rcgen = "0.13"
x509-parser = "0.18"

# ECH keyset 生成（X25519 公钥派生，对应 Go main/commands/all/tls/ech.go）+ base64 解码
x25519-dalek = { version = "2.0", features = ["static_secrets"] }
rand = { workspace = true }
base64 = "0.22"

# ECH DNS 查询路径（Go ech.go dnsQuery，PR #3813）
# hickory-proto：HTTPS RR (RFC 9460) / SVCB SvcParamKey::EchConfigList (key=5) 解码
hickory-proto = { workspace = true }
# h2/http/bytes：minimal DoH 客户端（RFC 8484 POST + application/dns-message），复用 xray-tls::utls 现有 TLS 握手
h2 = { workspace = true }
http = { workspace = true }
bytes = { workspace = true }
futures-util = { workspace = true }

[dev-dependencies]
# `#[tokio::test(start_paused = true)]` + `tokio::time::advance`：证书热重载的 3600 s
# 周期在虚拟时间里推进（生产常量不因测试改短）。tokio `full` 不含 test-util。
tokio = { workspace = true, features = ["test-util"] }
# 日志捕获（断言 echSockopt 的 WARN 真的发出且含键名；同 xray-proxy-vmess
# plugin.rs 的 capture_log 配方）。
tracing-subscriber = { workspace = true }

[features]
default = []
ocsp-stapling = ["dep:ocsp-stapler"]
