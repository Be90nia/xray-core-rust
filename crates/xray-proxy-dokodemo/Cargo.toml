[package]
name = "xray-proxy-dokodemo"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
xray-common = { path = "../xray-common" }
xray-features = { path = "../xray-features" }
xray-transport = { path = "../xray-transport" }
xray-app-dispatcher = { path = "../xray-app-dispatcher" }
xray-proto = { path = "../xray-proto" }
# P2 批次 B 插件化：L1/L4 面来自装配框架（src/plugin.rs impl xray_frame::Plugin
# 是生产代码——cargo 模型下必须生产依赖；xray-frame 不依赖协议 crate，无环，
# 拍板 P2.1 的"防环"由 xray-frame 单向不引协议 crate 保证）。
xray-frame = { path = "../xray-frame" }
# plugin.rs 段路由解析（settings → Config，同规 xray-conf DokodemoDoorInboundSettings）。
serde_json = { workspace = true }
thiserror = { workspace = true }
async-trait = "0.1"
tokio = { workspace = true }
tracing = { workspace = true }
[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[dev-dependencies]
tokio = { workspace = true, features = ["full", "test-util"] }

# bd g3cr: 生产代码零 unwrap（测试代码由 clippy.toml allow-unwrap-in-tests 豁免）
[lints.clippy]
unwrap_used = "deny"
