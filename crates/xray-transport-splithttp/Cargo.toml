[package]
name = "xray-transport-splithttp"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
xray-buf = { path = "../xray-buf" }
xray-common = { path = "../xray-common" }
xray-transport = { path = "../xray-transport" }
xray-proto = { path = "../xray-proto" }
xray-reality = { path = "../xray-reality" }
xray-tls = { path = "../xray-tls" }
# H3 CC 接线：复用 congestion_swappable BBR/Brutal 桥（TUIC 同款）
xray-transport-quic = { path = "../xray-transport-quic" }
# T3.2a 日志收敛：LogFacade（target = xray_frame::transport::splithttp）统一入口
xray-frame = { path = "../xray-frame" }
# xmux ManagerPool 注册表层：udf memgov::BoundedRegistry（keyed 有界注册表，
# fail-closed；bd 复核 2026-11-02 交付⑦）；pool = 池化读流的块池（udf ObjectPool，
# bd gz1ym 迁移）。path 形态同各 app crate（udf-frame 仓内工作副本即改即用；CI 由
# fetch-udf 拉料，不锁 rev）。
udf-skeleton-infra = { path = "../udf-frame/skeleton-infra", default-features = false, features = ["memgov", "pool"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
bytes = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }

# HTTP client (splithttp)
hyper = { workspace = true }
hyper-util = { workspace = true }
tower-service = "0.3"
http-body-util = { workspace = true }
hyper-rustls = { workspace = true }
http = { workspace = true }
futures-util = { workspace = true }
rustls = { workspace = true }
tokio-rustls = { workspace = true }
webpki-roots = { workspace = true }
rustls-pki-types = { workspace = true }
uuid = { workspace = true }
# H3 (splithttp packet-up/stream-up/stream-one over HTTP/3)
h3.workspace = true
h3-quinn.workspace = true
h2 = { version = "0.4", features = ["stream"] }
quinn.workspace = true
rand = { workspace = true }
parking_lot = { workspace = true }
tokio-util = "0.7"
tokio-stream = "0.1"
base64 = "0.22"
hex = "0.4"
# bd w5jhf：显式 receiveBufferSize 下发的 setsockopt 口（原为 dev-dep（88m0 防回档
# 测试回读口），生产拨号点消费后上移——workspace 版本对齐 ws/grpc）。
socket2 = { workspace = true }

[dev-dependencies]
rcgen = "0.13"
xray-features = { path = "../xray-features" }

# bd g3cr: 生产代码零 unwrap（测试代码由 clippy.toml allow-unwrap-in-tests 豁免）
[lints.clippy]
unwrap_used = "warn"
