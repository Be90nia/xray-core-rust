[package]
name = "xray-transport-hysteria"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
xray-buf = { path = "../xray-buf" }
xray-common = { path = "../xray-common" }
xray-proto = { path = "../xray-proto" }
xray-transport = { path = "../xray-transport" }
xray-transport-quic = { path = "../xray-transport-quic" }
xray-tls = { path = "../xray-tls" }
# 池化底座（bd bk4s7）：UdpHop buf 复用走 udf `ObjectPool`（槽位/借还记账/有界降级
# /分片），path 形态同各 app crate（udf-frame 仓内工作副本即改即用；CI 由 fetch-udf
# 拉料，不锁 rev）。
udf-skeleton-infra = { path = "../udf-frame/skeleton-infra", default-features = false, features = ["pool"] }
# T3.2a 日志收敛：LogFacade（target = xray_frame::transport::hysteria）统一入口
xray-frame = { path = "../xray-frame" }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
parking_lot = { workspace = true }
bytes = { workspace = true }
rand = { workspace = true }
quinn = { workspace = true }
quinn-proto = { workspace = true }
h3 = { workspace = true }
h3-quinn = { workspace = true }
http = { workspace = true }
hex = "0.4"
rustls = { workspace = true, default-features = false, features = ["ring"] }
serde_json = { workspace = true }
# masquerade「proxy」反代（bd 4zcki）：HTTP 客户端面。全部为 workspace 既有依赖
# （hyper/hyper-util/http-body-util/tokio-rustls/webpki-roots），无新增外部 crate。
hyper = { workspace = true }
hyper-util = { workspace = true }
http-body-util = { workspace = true }
tokio-rustls = { workspace = true }
webpki-roots = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["full", "test-util"] }
# udf 契约层：测试用固定时刻 `Clock` 注入 `prune_idle_with_clock`（bd ki2vo：
# udf #22 弃用 Instant 版；测试仍须可确定性推进，不能等真实 30s）。
udf-skeleton = { path = "../udf-frame/skeleton" }
rcgen = "0.13"
rustls = { workspace = true, default-features = false, features = ["ring"] }

# bd g3cr: 生产代码零 unwrap（测试代码由 clippy.toml allow-unwrap-in-tests 豁免）
[lints.clippy]
unwrap_used = "deny"
