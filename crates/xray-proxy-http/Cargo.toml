[package]
name = "xray-proxy-http"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
xray-common = { path = "../xray-common" }
xray-features = { path = "../xray-features" }
xray-buf = { path = "../xray-buf" }
xray-proto = { path = "../xray-proto" }
xray-transport = { path = "../xray-transport" }
xray-transport-splithttp = { path = "../xray-transport-splithttp" }
async-trait = "0.1"
# P2 批次 B 插件化：L1/L4 面来自装配框架（src/plugin.rs impl xray_frame::Plugin
# 是生产代码——cargo 模型下必须生产依赖；xray-frame 不依赖协议 crate，无环，
# 拍板 P2.1 的"防环"由 xray-frame 单向不引协议 crate 保证）。
xray-frame = { path = "../xray-frame" }
# B6（bd t975）：spawn 托管面走 udf skeleton_infra::fx::FxScope（坑约束 5）。
# path 形态同 xray-app-dns（udf-frame 仓内工作副本即改即用；CI 由 fetch-udf 拉料，不锁 rev）。
udf-skeleton-infra = { path = "../udf-frame/skeleton-infra", features = ["tokio"] }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
xray-app-dispatcher = { path = "../xray-app-dispatcher" }
serde_json = { workspace = true }
# h2 CONNECT 隧道（A-1）：h2 客户端直驱（hyper 1.x 客户端对 CONNECT 不 poll
# 请求 body，见 establish_h2_tunnel 注释）；全部为既有 workspace 依赖
bytes = { workspace = true }
h2 = { workspace = true }
http = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["full", "test-util"] }
# 测试专用 h2 server（hyper 1.x server 支持 CONNECT）
http-body-util = { workspace = true }
hyper = { workspace = true }
hyper-util = { workspace = true }
