[package]
name = "xray-core"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
# T1.1：Instance::close 停机编排走 udf ShutdownCoordinator（默认开）；关 = 旧逆序
# close 循环（无超时/无 panic 隔离）。shutdown 域 std-only 零 feature——
# default-features = false 避开 runtime/pool 默认档拖入运行时面。
default = ["shutdown-coordinator"]
shutdown-coordinator = ["dep:udf-skeleton-infra", "dep:xray-frame"]

[dependencies]
xray-common = { path = "../xray-common" }
# T1.1 停机编排桥依赖（经 feature 门启用；依赖形态对齐 xray-frame 注释约定：
# path 指向仓内 crates/udf-frame 唯一形态，不锁 rev）。
udf-skeleton-infra = { path = "../udf-frame/skeleton-infra", optional = true, default-features = false }
# bd 8zs12 停机报告出口（随 shutdown-coordinator feature 门）：报告走 xray-frame
# LogFacade（tracing 门面）——`xray_common::log` general 出口受 LogInstance::close
# gate=Off 控制而吞报告（真机实证）；tracing 进程级订阅器不随 feature 关闭。
# 依赖方向合规：xray-frame 零 xray-core 依赖（骨架不感知血肉），无环。
xray-frame = { path = "../xray-frame", optional = true }
base64 = "0.22"
hex = "0.4"
xray-features = { path = "../xray-features" }
xray-conf = { path = "../xray-conf" }
xray-app-dispatcher = { path = "../xray-app-dispatcher" }
xray-proxy-freedom = { path = "../xray-proxy-freedom" }
xray-proxy-vless = { path = "../xray-proxy-vless" }
xray-proxy-trojan = { path = "../xray-proxy-trojan" }
xray-proxy-vmess = { path = "../xray-proxy-vmess" }
xray-proxy-socks = { path = "../xray-proxy-socks" }
xray-proxy-blackhole = { path = "../xray-proxy-blackhole" }
xray-proxy-http = { path = "../xray-proxy-http" }
xray-proxy-dokodemo = { path = "../xray-proxy-dokodemo" }
xray-proxy-ss = { path = "../xray-proxy-ss" }
xray-proxy-hysteria = { path = "../xray-proxy-hysteria" }
xray-proxy-anytls = { path = "../xray-proxy-anytls" }
xray-proxy-tuic = { path = "../xray-proxy-tuic" }
xray-proxy-wireguard = { path = "../xray-proxy-wireguard" }
xray-proxy-dns = { path = "../xray-proxy-dns" }
xray-proxy-loopback = { path = "../xray-proxy-loopback" }
xray-mux = { path = "../xray-mux" }
xray-buf = { path = "../xray-buf" }
xray-transport = { path = "../xray-transport" }
xray-transport-tcp = { path = "../xray-transport-tcp" }
xray-proto = { path = "../xray-proto", features = ["grpc-server"] }
xray-transport-hysteria = { path = "../xray-transport-hysteria" }
xray-transport-grpc = { path = "../xray-transport-grpc" }
xray-transport-quic = { path = "../xray-transport-quic" }
xray-transport-httpupgrade = { path = "../xray-transport-httpupgrade" }
xray-transport-kcp = { path = "../xray-transport-kcp" }
xray-transport-splithttp = { path = "../xray-transport-splithttp" }
