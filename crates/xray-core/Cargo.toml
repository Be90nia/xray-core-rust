tokio-rustls = { workspace = true }
rcgen = "0.13"
rustls-pemfile = "2"
parking_lot = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-util = "0.7"
tracing = { workspace = true }
serde_json = { workspace = true }
prost = { workspace = true }
# bd jezb：gRPC HandlerService（proxyman command trait 为 async_trait）生产实现
async-trait = { workspace = true }
rand = { workspace = true }
uuid = { workspace = true }
rustls = { workspace = true }
tonic = { workspace = true }
webpki-roots = { workspace = true }

[dev-dependencies]
uuid = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt"] }
serde_json = { workspace = true }
x25519-dalek = { version = "2.0", features = ["static_secrets"] }
# P3-2 对拍测试：插件 build 管线（build_plugins_from_config）vs 旧 core 解析面。
xray-frame = { path = "../xray-frame" }
# TUN 设备代理——仅 Linux/Android/FreeBSD 自动编译
# macOS 不编译（需 utun 权限）；Windows 已支持（wintun.dll 放 exe 旁即用，bd cv3w/ijn7）
[target.'cfg(any(target_os = "linux", target_os = "android", target_os = "freebsd", target_os = "windows"))'.dependencies]
xray-proxy-tun = { path = "../xray-proxy-tun" }

# DNS UDP recvmmsg 批收（bd yblz）——仅 Linux gnu：musl/uclibc 的 libc 未导出 recvmmsg 函数。
[target.'cfg(all(target_os = "linux", target_env = "gnu"))'.dependencies]
libc = "0.2"