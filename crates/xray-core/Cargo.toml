xray-app-metrics = { path = "../xray-app-metrics" }
xray-app-observatory = { path = "../xray-app-observatory" }
xray-app-policy = { path = "../xray-app-policy" }
xray-app-proxyman = { path = "../xray-app-proxyman" }
xray-app-reverse = { path = "../xray-app-reverse" }
xray-app-router = { path = "../xray-app-router" }
xray-app-stats = { path = "../xray-app-stats" }
xray-app-version = { path = "../xray-app-version" }
