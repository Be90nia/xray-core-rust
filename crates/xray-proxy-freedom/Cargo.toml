[package]
name = "xray-proxy-freedom"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
xray-common = { path = "../xray-common" }
xray-features = { path = "../xray-features" }
xray-transport = { path = "../xray-transport" }
xray-buf = { path = "../xray-buf" }
xray-app-dispatcher = { path = "../xray-app-dispatcher" }
xray-app-proxyman = { path = "../xray-app-proxyman" }
rand = { workspace = true }
xray-proto = { path = "../xray-proto" }
async-trait = "0.1"
thiserror = { workspace = true }
tokio = { workspace = true }
xray-xudp = { path = "../xray-xudp" }
xray-geodata = { path = "../xray-geodata" }
tracing = { workspace = true }
serde_json = { workspace = true }
# noises[] 的 `type` 四值（rand/str/hex/base64，Go infra/conf/freedom.go:217-262）
# 需要 hex/base64 解码；两个 crate 已在 workspace 依赖树内（xray-core 同版本消费）。
base64 = "0.22"
hex = "0.4"
# P2 批次 B 插件化：L1/L4 面来自装配框架（src/plugin.rs impl xray_frame::Plugin
# 是生产代码——cargo 模型下必须生产依赖；xray-frame 不依赖协议 crate，无环，
# 拍板 P2.1 的"防环"由 xray-frame 单向不引协议 crate 保证）。
xray-frame = { path = "../xray-frame" }
# B6（bd t975）：spawn 托管面走 udf skeleton_infra::fx::FxScope（坑约束 5）。
# path 形态同 xray-app-dns（udf-frame 仓内工作副本即改即用；CI 由 fetch-udf 拉料，不锁 rev）。
udf-skeleton-infra = { path = "../udf-frame/skeleton-infra", features = ["tokio"] }

[dev-dependencies]
parking_lot = { workspace = true }
tokio = { workspace = true, features = ["full", "test-util"] }
