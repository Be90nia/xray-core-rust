[package]
name = "xray-conf"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
xray-common = { path = "../xray-common" }
xray-features = { path = "../xray-features" }
xray-geodata = { path = "../xray-geodata" }
# W2 面 1（能力收敛方案 §2）：Value 级折叠切 XrayConfigLayers。依赖方向
# xray-conf → xray-frame 无环（xray-frame 不依赖本 crate）；代价 = 生产树引入
# tokio/bytes/xray-buf（xray-frame 经 udf-skeleton-infra）——方案已接受（启动期 crate）。
xray-frame = { path = "../xray-frame" }
parking_lot = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
# lint 阶段编排（bd bx7my 上浮）：注册表/锁外 post_process 在 udf `skeleton::lint`，
# 本 crate 只留阶段内容 + Go 错误文案（见 src/lint.rs 模块 doc）。
udf-skeleton = { path = "../udf-frame/skeleton" }
udf-std-ext = { path = "../udf-frame/std-ext", features = ["json"] }
# xdrive lint（bd hjtlk B0）：ENC 判定复用 vless 的既有解析器（parse_client_encryption /
# parse_server_decryption），禁另写一份。依赖方向 xray-conf → xray-proxy-vless 无环
# （vless 不依赖本 crate），workspace 内已被 xray-core 构建，无增量编译成本。
xray-proxy-vless = { path = "../xray-proxy-vless" }

[dev-dependencies]
# 3c 影子比对（票 xiuvr）：skeleton_infra::config::ConfigFile 对照旧装载路径。
# dev-only——生产依赖树零增量（与 udf-std-ext 常驻依赖同形态：path 即仓内工作副本）。
udf-skeleton-infra = { path = "../udf-frame/skeleton-infra", features = ["config-json"] }