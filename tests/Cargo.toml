[package]
name = "xray-integration-tests"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[test]]
name = "integration"
path = "integration/vmess_test.rs"

[[test]]
name = "integration_vless"
path = "integration/vless_test.rs"

[[test]]
name = "integration_trojan"
path = "integration/trojan_test.rs"

[[test]]
name = "integration_ss"
path = "integration/ss_test.rs"

[[test]]
name = "integration_compatibility"
path = "integration/compatibility_test.rs"

[[test]]
name = "integration_interop_vmess"
path = "integration/interop_vmess_test.rs"

[[test]]
name = "integration_interop_vless"
path = "integration/interop_vless_test.rs"

[[test]]
name = "integration_interop_trojan"
path = "integration/interop_trojan_test.rs"

[[test]]
name = "integration_interop_ss"
path = "integration/interop_ss_test.rs"

[[test]]
name = "integration_e2e"
path = "integration/e2e_test.rs"
[[test]]
name = "integration_e2e_p2"
path = "integration/e2e_p2_test.rs"

 [[test]]
 name = "integration_commander_api"
 path = "integration/commander_api_test.rs"

 [[test]]
 name = "integration_grpc_multimode"
 path = "integration/grpc_multimode_e2e_test.rs"

 [[test]]
 name = "integration_transport_interop"
 path = "integration/transport_interop_test.rs"

[dev-dependencies]
tokio = { workspace = true, features = ["full", "test-util"] }
xray-common = { path = "../crates/xray-common" }
xray-proxy-vmess = { path = "../crates/xray-proxy-vmess" }
xray-proxy-vless = { path = "../crates/xray-proxy-vless" }
xray-proxy-trojan = { path = "../crates/xray-proxy-trojan" }
xray-proxy-ss = { path = "../crates/xray-proxy-ss" }
xray-proxy-freedom = { path = "../crates/xray-proxy-freedom" }
xray-mux = { path = "../crates/xray-mux" }
xray-app-dispatcher = { path = "../crates/xray-app-dispatcher" }
xray-transport = { path = "../crates/xray-transport" }
xray-buf = { path = "../crates/xray-buf" }
xray-proto = { path = "../crates/xray-proto", features = ["grpc-client"] }
tonic = { workspace = true }
tonic-reflection = { workspace = true }
futures = { workspace = true }
xray-app-log = { path = "../crates/xray-app-log" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tempfile = "3"
xray-core = { path = "../crates/xray-core" }
xray-tls = { path = "../crates/xray-tls" }
xray-reality = { path = "../crates/xray-reality" }
xray-app-dns = { path = "../crates/xray-app-dns" }
xray-conf = { path = "../crates/xray-conf" }
base64 = "0.22"
x25519-dalek = { version = "2.0", features = ["static_secrets"] }
rand = "0.8"
hex = "0.4"
boringtun = { workspace = true }
sha2 = "0.10"
