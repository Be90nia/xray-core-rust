# x86_64 指令集策略（bd f39e / 新票 f2v-：性能与正确性冲突，**当前取正确性**）
#
# 性能实测（tools/loopback_alloc_bench.py，同机同配置 3 轮，加密链拓扑）：
#   - 仅 -C target-cpu=x86-64（当前采用）        ：37.8 / 39.1 / 39.2 MB/s
#   - +sse4.1,+sse4.2,+popcnt                    ：155 / 140 / 157 MB/s
#   - +aes,+pclmulqdq,+sse4.1,+sse4.2,+popcnt    ：158 / 178 / 174 MB/s
#   - -C target-cpu=native                       ：159 / 183 / 189 MB/s
#
# **但 SSE4 构建在真网络 vision 互通上显著劣化正确性**（176 VPS 真链路，
# vless_vision_tls，Go 服务端 + Rust 客户端，各 5 轮）：
#   - 纯 x86-64 构建：4/5 与 4/5（合计 8/10）
#   - SSE4 构建     ：1/5 与 2/5（合计 3/10）
#   - Go↔Go 对照    ：5/5
# 判定：SSE4 编译疑似暴露 vision/record-framer 路径的 UB（向量化后触发），
# 在定位修好前**不得启用 target-feature**。see bd ticket（已开，标 P1）。
#
# 回退历史：本文件曾于 2026-10-22 夜启用 +sse4.*（性能 4.5x），因上述正确性
# 证据回退。定位方向：vision/xtls 的 unsafe 读写、RecordFramer 未对齐读取、
# borrow 越界读，用 `cargo +nightly -Z sanitizer` 或 miri 在 Linux 上复现。
#
# 交叉编译安全：本表用 cfg(target_arch = "x86_64") 限定，aarch64/arm 不命中。
# 临时 native 自测：CARGO_BUILD_RUSTFLAGS="-C target-cpu=native"（勿改本文件）。

[target.'cfg(target_arch = "x86_64")']
rustflags = ["-C", "target-cpu=x86-64"]
