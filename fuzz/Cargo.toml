[package]
name = "xray-core-rust-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

# fuzz/ 位于主 workspace 目录树内，必须显式声明为独立 workspace 根，
# 否则 cargo 会把它挂到上级 workspace（fuzz 不进主 workspace members）。
[workspace]

[dependencies]
libfuzzer-sys = "0.4"
tokio = { version = "1.53", default-features = false, features = ["rt"] }
xray-common = { path = "../crates/xray-common" }
xray-transport-kcp = { path = "../crates/xray-transport-kcp" }
xray-proxy-ss = { path = "../crates/xray-proxy-ss" }
xray-proxy-vless = { path = "../crates/xray-proxy-vless" }

# fuzz/ 是独立 workspace（不在根 workspace members 内），[patch] 不跨 workspace
# 继承——必须与根 Cargo.toml 保持逐字一致，否则 rustls/quinn-proto 解析到
# 未 patch 的 crates.io 版本（Watfaq fork 提供 REALITY with_reality() API）。
[patch.crates-io]
# rustls/tokio-rustls: CI 环境 git fetch 经常受限/超时（无 GH token / 网络限制），
# 失败时 cargo 会静默 fallback 到 crates.io registry 0.23.45——而 0.23.45 已删
# `new_with_session_id_generator` API，会让 Watfaq fork 残留调用点 E0599 编译失败。
# 改 path vendor 后 CI 100% 可达；vendor/rustls 内有完整 `new_with_session_id_generator`
# 实现（client_conn.rs:744），vendor/tokio-rustls 已删 Shadow-TLS V3 公开 API
# （gqkk 报告记全仓无调用方），与 rustls 0.23.45 ABI 兼容。
rustls = { path = "../vendor/rustls" }
tokio-rustls = { path = "../vendor/tokio-rustls" }
quinn-proto = { path = "../vendor/quinn-proto" }

[[bin]]
name = "kcp_segment"
path = "fuzz_targets/kcp_segment.rs"
test = false
doc = false
bench = false

[[bin]]
name = "ss2022_packet"
path = "fuzz_targets/ss2022_packet.rs"
test = false
doc = false
bench = false

[[bin]]
name = "vless_inbound"
path = "fuzz_targets/vless_inbound.rs"
test = false
doc = false
bench = false
