# cargo-deny 配置（ci.yml Security & License job 读取）。
# 极简：仅配置 sources + advisories；bans/licenses/sources 不放宽默认（与 5 维 P1 治理一致）。
# 5 维红线：不动 denials / 不断 security 默认；只补 sources allow-git + 单条已挂账 advisory 豁免。

# ─────────────────────────── sources ───────────────────────────
# 默认 unknown-git = "deny"；本仓 3 个 btls-* 依赖全部指向 Be90nia 私 fork（fix-gqkk 票面已锁）。
# vendor/{rustls,tokio-rustls,quinn-proto} 是 path 依赖，cargo-deny 默认放行 path，不需要 allow。
[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = [
    "https://github.com/Be90nia/btls", # 核心 REALITY/utls 实现（v0.5.6，gqkk 票固定）
]

# ─────────────────────────── advisories ───────────────────────────
# RUSTSEC-2024-0449 = rustls-pemfile 0.6.0 unmaintained（5 维安全债 DEBT-007 已知）。
# 现行消除路径 = 迁 rustls-pki-types 0.10 + 全面 rustls 0.23 化（gqkk 已迁大部分）；
# 残余 0.6.0 调用点单票处置中（独立 bd 票，非本修法范围）。本豁免不掩盖未来新增 advisory。
[advisories]
ignore = [
    "RUSTSEC-2024-0449", # rustls-pemfile 0.6.0 unmaintained
]
