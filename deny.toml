# cargo-deny 配置（ci.yml Security & License job 读取）。
# 极简：仅配置 sources + advisories；bans/licenses/sources 不放宽默认（与 5 维 P1 治理一致）。
# 5 维红线：不动 denials / 不断 security 默认；只补 sources allow-git + 单条已挂账 advisory 豁免。

# ─────────────────────────── sources ───────────────────────────
# 默认 unknown-git = "deny"；本仓 3 个 btls-* 依赖全部指向 Be90nia 私 fork（fix-gqkk 票面已锁）。
# vendor/{rustls,tokio-rustls,quinn-proto} 是 path 依赖，cargo-deny 默认放行 path，不需要 allow。
[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = [
    "https://github.com/Be90nia/btls", # 核心 REALITY/utls 实现（v0.5.6，gqkk 票固定）
    # if-addrs 0.15.0 从 messense fork 的固定 rev 取（上游 0.15 未发布该修复；
    # 见 Cargo.toml 的 if-addrs git 依赖）。rev 已钉死，非浮动源。
    "https://github.com/messense/if-addrs",
]

# ─────────────────────────── advisories ───────────────────────────
# bd 6ts1f（2026-11-07）：2026-10-22 的两条 risk-accept（RUSTSEC-2026-0382
# rustls-webpki 0.103.15 / RUSTSEC-2026-0381 webpki-roots 1.0.8，「本机 crates.io
# 不可达」）已删除——锁文件实为修复版 rustls-webpki 0.103.16 + webpki-roots 0.26.11，
# cargo-deny 实测这两条豁免已空转（advisory-not-detected），恢复阻断保护。
# block-buffer 0.12.0 的 GHSA-qwgh-2vcv-g2f7（panic 后行内缓冲游标损坏）RustSec 尚未
# 收录，cargo-deny 面看不见 → 只在本仓 osv 面（.osv-scanner.toml）挂账；RustSec 收录
# 后转 ignore，并随工具链升级窗口 bump 0.12.0→0.12.1 消除（semver 兼容）。
[advisories]
ignore = [
    "RUSTSEC-2024-0449", # unsafe-libyaml 0.2.11 unmaintained（dtolnay 已停更），serde_yaml→yaml-rust2 迁移跨仓评估中（.osv-scanner.toml 同口径）
    "RUSTSEC-2024-0436", # paste 1.0.15 unmaintained，proc-macro only 无 fix（.osv-scanner.toml 同口径）
    "RUSTSEC-2023-0071", # rsa 0.9.10 底层 num-bigint-dig 大数运算非常数时间（Marvin）；盲化已落地（xmc conn.go 对位 DecryptPKCS1v15(rand.Reader) → decrypt_blinded，bd 2emrf），残余为纯 Rust 实现的时序面，彻底脱离需换 btls。.osv-scanner.toml 同口径
    "RUSTSEC-2025-0134", # rustls-pemfile 2.2.0 unmaintained（rustls/pemfile archived 2025-08），迁 pki-types 单票处置（.osv-scanner.toml 同口径）
]

# ─────────────────────────── licenses ───────────────────────────
# 显式列常用 license 允许集（cargo-deny 没 [licenses] 段时用严格默认 deny 未知 license）。
# 5 维红线不放松：未列 license 仍 deny；本表只覆盖白名单许可。
[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "MPL-2.0",
    "Zlib",
    "OpenSSL",
    "CC0-1.0",
    "0BSD",
    "BSL-1.0",
    "PSF-2.0",
    "WTFPL",
    "NCSA",
    "curl",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8

[[licenses.exceptions]]
# socks5-impl 0.8.7 (GPL-3.0-or-later)：crates.io anytls 0.3.5 的传递依赖。
# 用户拍板（2026-10-13）：xray.exe 仅自用不分发——GPL 义务由"分发"触发，
# 自用不构成约束。本豁免仅为 CI 门禁放行；若未来改为对外分发再重开评估。
allow = ["GPL-3.0-or-later"]
name = "socks5-impl"

