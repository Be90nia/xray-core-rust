# 互通 CI: macOS 双架构真机 + Ubuntu 跑 Rust<->Rust 全矩阵与 Go 基线交叉
# 销账: TUN/BSD/Darwin P4 波 (macOS workspace 全量编译即 darwin 编译烂账防线)

name: Interop

on:
  workflow_dispatch:
  push:
    branches: [master, main, dev]

env:
  CARGO_TERM_COLOR: always

jobs:
  interop:
    name: Interop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-13, ubuntu-24.04]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # xray-proto build.rs 走 prost-build compile_protos, 需要 protoc
      - name: Install protoc
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get update -q && sudo apt-get install -y -q protobuf-compiler
          else
            brew install protobuf
          fi

      # btls-sys 在干净环境走其内部 submodule 流程会产出 unpatched libcrypto
      # (rust-lld: undefined symbol SSL_set_reality_rewrite_cb /
      #  SSL_get_x25519_key_share_private)。Docker 床实证配方: 预取 boringssl
      # 固定 rev (Cargo.lock 内 btls-sys git rev 对应的 submodule pin) +
      # 按 build/main.rs ensure_patches_applied 同序预打补丁, 再用
      # ASSUME_PATCHED+SOURCE_PATH 让 btls-sys 直接消费已补丁源码。
      - name: Prepare patched boringssl for btls-sys
        shell: bash
        run: |
          set -euo pipefail
          cargo fetch
          rev=$(awk '/^name = "btls-sys"/{f=1;next} f&&/^source/{print;exit}' Cargo.lock \
            | sed 's/.*#\([0-9a-f]\{40\}\)".*/\1/')
          patches_dir=$(ls -d "$HOME"/.cargo/git/checkouts/btls-*/"${rev:0:7}"*/btls-sys/patches | head -1)
          bssl="$RUNNER_TEMP/boringssl"
          git init -q "$bssl"
          git -C "$bssl" remote add origin https://github.com/google/boringssl.git
          git -C "$bssl" fetch -q --depth 1 origin "$rev"
          git -C "$bssl" checkout -q FETCH_HEAD
          git -C "$bssl" apply -v --whitespace=fix "$patches_dir/boring-pq.patch"
          git -C "$bssl" apply -v --whitespace=fix "$patches_dir/boringssl.patch"
          git -C "$bssl" apply -v --whitespace=fix "$patches_dir/boringssl-loongarch.patch"
          git -C "$bssl" apply -v --whitespace=fix "$patches_dir/boringssl-windows.patch"
          echo "BORING_BSSL_ASSUME_PATCHED=1" >> "$GITHUB_ENV"
          echo "BORING_BSSL_SOURCE_PATH=$bssl" >> "$GITHUB_ENV"

      # macOS 上 workspace 全量编译本身即 darwin 编译烂账防线
      - name: Workspace lib tests
        run: cargo test --workspace --lib

      - name: Build release binary
        run: cargo build --release --bin xray

      # Go 基线 = 官方 release 二进制 (禁 git clone 全仓构建)
      - name: Download Go baseline (xray-core v26.9.9)
        shell: bash
        run: |
          set -euo pipefail
          case "$RUNNER_OS:$(uname -m)" in
            macOS:arm64)   asset=Xray-macos-arm64-v8a.zip ;;
            macOS:x86_64)  asset=Xray-macos-64.zip ;;
            Linux:x86_64)  asset=Xray-linux-64.zip ;;
            Linux:aarch64) asset=Xray-linux-arm64-v8a.zip ;;
            *) echo "unsupported platform: $RUNNER_OS $(uname -m)"; exit 1 ;;
          esac
          curl -fsSL -o /tmp/xray-go.zip \
            "https://github.com/XTLS/Xray-core/releases/download/v26.9.9/$asset"
          mkdir -p tools/xray-go
          unzip -o /tmp/xray-go.zip -d tools/xray-go xray
          chmod +x tools/xray-go/xray
          tools/xray-go/xray version

      - name: Interop tests (Rust<->Rust 12 + Go->Rust 3)
        run: python3 dist/interop_ci.py --rust target/release/xray --go tools/xray-go/xray

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: interop-logs-${{ matrix.os }}
          path: target/interop_ci/
          if-no-files-found: ignore
