# 互通 CI: macOS 双架构真机 + Ubuntu 跑 Rust<->Rust 全矩阵与 Go 基线交叉
# 销账: TUN/BSD/Darwin P4 波 (macOS workspace 全量编译即 darwin 编译烂账防线)

name: Interop

on:
  workflow_dispatch:
  push:
    branches: [master, main, dev]

env:
  CARGO_TERM_COLOR: always
  # 覆盖 .cargo/config.toml 的 target-cpu=native（bd hxy3）：交叉/发行构建保持
  # 通用 target 生成；RUSTFLAGS env 完全覆盖 build.rustflags（cargo 语义）。
  RUSTFLAGS: ""

jobs:
  interop:
    name: Interop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # macos-13(Intel) 已被 GitHub 淘汰，公开/私有仓均无 runner 分配，
        # 永久摘除（2026-09-14 实证：公开仓也永远排队）。
        os: [macos-14, ubuntu-24.04]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # btls 全量重编（6090b54 删 target cache 后每 run 冷构建）+ Go 二进制会
      # 吃满 runner 14GB 磁盘（run 35044431842 实锤 No space left on device）
      - name: Free up disk space
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          sudo docker image prune -af
      # xray-proto build.rs 走 prost-build compile_protos, 需要 protoc
      - name: Install protoc
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get update -q && sudo apt-get install -y -q protobuf-compiler
          else
            brew install protobuf
          fi

      # Python cryptography (X25519 keypair for REALITY config; stdlib 没有)
      - name: Ensure cryptography
        run: |
          python3 -c "import cryptography" 2>/dev/null || pip install --quiet cryptography

      # btls-sys 在干净环境走其内部 submodule 流程会产出 unpatched libcrypto，
      # 配方统一收编为 composite action（bd kumd，与 build-linux-release/mobile 同源）
      - uses: ./.github/actions/setup-boringssl

      # macOS 上 workspace 全量编译本身即 darwin 编译烂账防线
      - name: Workspace lib tests
        run: cargo test --workspace --lib

      - name: Build release binary
        run: cargo build --release --bin xray

      # Go 基线 = 官方 release 二进制 (禁 git clone 全仓构建)
      - name: Download Go baseline (xray-core v26.9.9)
        shell: bash
        run: |
          set -euo pipefail
          case "$RUNNER_OS:$(uname -m)" in
            macOS:arm64)   asset=Xray-macos-arm64-v8a.zip ;;
            macOS:x86_64)  asset=Xray-macos-64.zip ;;
            Linux:x86_64)  asset=Xray-linux-64.zip ;;
            Linux:aarch64) asset=Xray-linux-arm64-v8a.zip ;;
            *) echo "unsupported platform: $RUNNER_OS $(uname -m)"; exit 1 ;;
          esac
          curl -fsSL -o /tmp/xray-go.zip \
            "https://github.com/XTLS/Xray-core/releases/download/v26.9.9/$asset"
          mkdir -p tools/xray-go
          unzip -o /tmp/xray-go.zip -d tools/xray-go xray
          chmod +x tools/xray-go/xray
          tools/xray-go/xray version

      - name: Interop tests (Rust<->Rust 12 + Go->Rust 6 + Rust->Go 6 + 13 新协议套件)
        run: python3 dist/interop_ci.py --rust target/release/xray --go tools/xray-go/xray

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: interop-logs-${{ matrix.os }}
          path: target/interop_ci/
          if-no-files-found: ignore
