name: build-linux-release
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-linux-release.yml'
jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake nasm pkg-config libssl-dev unzip
          # apt 的 protobuf-compiler 太旧（3.12）不支持 proto3 optional，下载新版 protoc 二进制替代
          curl -fsSL -o /tmp/protoc.zip https://github.com/protocolbuffers/protobuf/releases/download/v36.1/protoc-36.1-linux-x86_64.zip
          sudo unzip -o /tmp/protoc.zip -d /usr/local
          rm /tmp/protoc.zip
          /usr/local/bin/protoc --version
      # 只 cache registry/git（不要 cache target——btls-sys 编译产出必须在每次 run 重做
      # 否则命中脏 cache 会链接到 unpatched libcrypto 缺 SSL_get_x25519_key_share_private /
      # SSL_set_reality_rewrite_cb 符号；版本字段 v3 让之前的 cache 全部 miss）
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-registry-v3-${{ hashFiles('**/Cargo.lock') }}
      - name: Build release
        run: cargo build --release -p xray-cli --target x86_64-unknown-linux-gnu
      - name: Verify binary
        run: file target/x86_64-unknown-linux-gnu/release/xray
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: xray-linux-gnu
          path: target/x86_64-unknown-linux-gnu/release/xray
          retention-days: 1
