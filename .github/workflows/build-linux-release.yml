name: build-linux-release
env:
  # 覆盖 .cargo/config.toml 的 target-cpu=native（bd hxy3）：发行产物保持通用
  # target 生成；RUSTFLAGS env 存在时完全覆盖 build.rustflags（cargo 语义）。
  RUSTFLAGS: ""

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-linux-release.yml'
jobs:
  build:
    # hosted ubuntu-22.04 VM image 已退休 → 用 24.04 runner + ubuntu:22.04 容器
    # 锚定 glibc 2.35（产物需兼容部署目标 Debian 12 glibc 2.36；24.04 直出产物
    # 依赖 GLIBC_2.38，Debian 12 实测 /lib/x86_64-linux-gnu/libc.so.6 version
    # `GLIBC_2.38' not found 起不来——run 36411051936 产物实锤）。
    runs-on: ubuntu-24.04
    container:
      image: ubuntu:22.04
    timeout-minutes: 60
    steps:
      - name: Install base + build deps
        run: |
          apt-get update
          # 容器精简镜像缺 git/curl/ca-certificates/python3（checkout 与
          # rust-toolchain、pgo workload 依赖）与 gcc/g++（rustc linker `cc`
          # + boringssl C/C++ 编译；hosted VM 预装 build-essential，容器须显式装）；
          # build deps 同原 hosted 步骤。
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates curl git python3 cmake nasm pkg-config libssl-dev unzip gcc g++ make clang file
          # apt 的 protobuf-compiler 太旧（3.12）不支持 proto3 optional，下载新版 protoc 二进制替代
          curl -fsSL -o /tmp/protoc.zip https://github.com/protocolbuffers/protobuf/releases/download/v36.1/protoc-36.1-linux-x86_64.zip
          unzip -o /tmp/protoc.zip -d /usr/local
          rm /tmp/protoc.zip
          /usr/local/bin/protoc --version
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      # btls-sys 在干净环境走其内部 submodule 流程会产出 unpatched libcrypto，
      # 配方统一收编为 composite action（bd kumd，与 interop/mobile 同源）
      - uses: ./.github/actions/setup-boringssl

      # 只 cache registry/git（不要 cache target——btls-sys 编译产出必须在每次 run 重做
      # 否则命中脏 cache 会链接到 unpatched libcrypto）
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-registry-v4-${{ hashFiles('**/Cargo.lock') }}
      # bd 4m1u: PGO 优化构建——instrumented build → loopback workload 采
      # profile（socks->freedom 泵，覆盖 dispatcher/bridge 热路径）→
      # profile-use 重编。收益参考 kobzol cargo-pgo（+5-15%），最终二进制
      # 由 cargo pgo optimize 原位输出到 target/<target>/release/xray。
      - name: Install cargo-pgo + llvm-tools
        run: |
          rustup component add llvm-tools-preview
          cargo install cargo-pgo --locked
      - name: PGO build (instrument -> workload -> optimize)
        run: |
          cargo pgo build -- -p xray-cli --target x86_64-unknown-linux-gnu
          python3 tools/pgo_workload.py --xray target/x86_64-unknown-linux-gnu/release/xray --duration 30
          cargo pgo optimize -- -p xray-cli --target x86_64-unknown-linux-gnu
      - name: Verify binary
        run: file target/x86_64-unknown-linux-gnu/release/xray
      # bd m1t5：发行 feature 闭包下 REALITY 生产 TLS 冒烟门——server_tls
      # (build_server_config) + u_client 完整握手；rustls 双 CryptoProvider
      # unification 时裸 builder() panic 由生产侧 install_default 兜底
      # （bd rknm），此处 panic 即回归。feature unification 与 profile 无关，
      # debug 等价覆盖且不额外吃 30min 预算。
      - name: REALITY TLS smoke test
        run: cargo test -p xray-reality --test reality_tls_smoke
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: xray-linux-gnu
          path: target/x86_64-unknown-linux-gnu/release/xray
          retention-days: 1
