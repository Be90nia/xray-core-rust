# 移动端编译门：Android (aarch64) 真编译 + iOS (aarch64) workspace check。
# btls-sys 变数：build/main.rs 有 android/ios 分支消费 ANDROID_NDK_HOME 与
# 平台 cflag，boringssl 对双平台官方支持；若 CI 证明 btls-sys 交叉短期攻不下，
# 下一版降级为 workspace check --exclude btls 依赖闭包并在 job 里 echo 覆盖范围。

name: Mobile Gates

on:
  workflow_dispatch:
  push:
    branches: [master, main, dev]

env:
  CARGO_TERM_COLOR: always

jobs:
  android:
    name: Android aarch64 build gate
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      # boringssl 的 cmake 配置需要 go（生成测试清单/部分源码）
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r27c
          add-to-path: false
      - name: Install protoc
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q protobuf-compiler
      - name: Set NDK cross env
        run: |
          {
            echo "ANDROID_NDK_HOME=${{ steps.ndk.outputs.ndk-path }}"
            echo "CC_aarch64_linux_android=${{ steps.ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang"
            echo "CXX_aarch64_linux_android=${{ steps.ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang++"
            echo "AR_aarch64_linux_android=${{ steps.ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar"
            # cargo 链接器：缺省落宿主 ld（Relocations in generic ELF EM:183），必须指 NDK wrapper
            echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=${{ steps.ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang"
          } >> "$GITHUB_ENV"
      - name: Build xray (aarch64-linux-android, exclude xray-proxy-tun)
        run: |
          echo "覆盖范围：-p xray-cli --bin xray 排除 xray-proxy-tun（tun_rs 无 android target API：DeviceBuilder/Layer/if_index 未导出，与 iOS 同因；Android 生态 VpnService 由宿主 App 注入流量）——含 btls-sys cmake 交叉编译（boringssl 官方支持 android，btls-sys build/main.rs android 分支消费 ANDROID_NDK_HOME）"
          cargo build --target aarch64-linux-android -p xray-cli --bin xray --exclude xray-proxy-tun

  ios:
    name: iOS aarch64 check gate
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios
      # boringssl cmake 需要 go（macos-14 镜像缺省无 go）
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Install protoc
        run: brew install protobuf
      - name: Check workspace (aarch64-apple-ios, exclude xray-proxy-tun)
        run: |
          echo "覆盖范围：workspace 全量 check --target aarch64-apple-ios，排除 xray-proxy-tun——tun_rs 无 iOS target（DeviceBuilder/Layer/if_index 未导出），iOS 平台本无 tun fd（生态=NEPacketTunnelProvider 由宿主 App 注入流量），xray-proxy-tun 在 iOS 不可实现；btls-sys cmake 走 ios 分支编 boringssl，macos-14 自带 iOS SDK；check 不产 iOS 可执行，仅编译门"
          cargo check --workspace --exclude xray-proxy-tun --target aarch64-apple-ios
