# 跨平台长跑压测（macOS 单 job 6h 内 + ubuntu 6h 档；手动触发）。
# 产物：summary.md + metrics.csv 上传 artifact。
# iOS/Android 不跑压测（无 runner，Mobile Gates 编译门维持现状）。
name: stress

on:
  workflow_dispatch:
    inputs:
      hours:
        description: 'Run duration in hours (job timeout = hours*60 + 90min build margin)'
        required: false
        default: '5'

jobs:
  stress:
    timeout-minutes: 390  # 6h 硬顶（5h run + build margin）；GitHub 平台 6h/job 墙更硬，hours 必须 ≤5
    strategy:
      fail-fast: false
      matrix:
        # 分批跑：12 场景 all 并发时 5 个短连接风暴场景(s1/s5/s7/s8/s11)挤兑 ephemeral 端口预算，
        # 实测(run 35558871262)各 fail 15 万次成功仅数百；两批各 6 场景避开
        include:
          - os: macos-14
            label: macos
            batch: a
          - os: macos-14
            label: macos
            batch: b
          - os: ubuntu-latest
            label: linux
            batch: a
          - os: ubuntu-latest
            label: linux
            batch: b
          - os: windows-latest
            label: windows
            batch: all
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # 泄漏门禁脚本（tools/check_stress_leak.py）需要 python；setup-python 三平台统一提供
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      # boringssl cmake 配置需要 go（macos-14 镜像缺省无 go）
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Install protoc
        shell: pwsh
        run: |
          if ($env:RUNNER_OS -eq "Linux") {
            sudo apt-get update -q && sudo apt-get install -y -q protobuf-compiler
          } elseif ($env:RUNNER_OS -eq "macOS") {
            brew install protobuf
          } else {
            # Windows: xray-stress 本身无 protoc 依赖,但其依赖图含 xray-proto(prost-build)需要 protoc。
            # windows-latest runner 预装 choco,直接装 protobuf。
            choco install -y protoc 2>&1 | Out-Null
            # choco 把 protoc 装到 C:\ProgramData\chocolatey\bin\protoc.exe,加到 PATH
            $env:PATH = "C:\ProgramData\chocolatey\bin;$env:PATH"
            echo "C:\ProgramData\chocolatey\bin" | Out-File -FilePath $env:GITHUB_PATH -Append
            Write-Host "protoc: $(protoc --version)"
          }
      - uses: ./.github/actions/setup-boringssl
      - name: Raise FD limit (Linux/macOS)
        shell: bash
        run: |
          # macos-14 runner 默认 ulimit -n 256,Linux 默认 1024,都不够 6 场景 × 200 conn/s × 5h。
          # hard limit 通常 >= 524288(GHA runner),把 soft 提到 hard 即可。
          target=524288
          cur=$(ulimit -n)
          ulimit -Sn "$target" 2>/dev/null || ulimit -n "$target" 2>/dev/null || true
          echo "nofile: ${cur} → $(ulimit -n) (target ${target})"
      - name: Expand ephemeral port range (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Windows 默认动态端口 49152-65535(16384 个)+TIME_WAIT 120s:
          # 压测 280 conn/s × 120s ≈ 33k 在途 > 16k 上限 → WSAEADDRINUSE(10048)风暴
          # (run 35852965001 实测 15.2 万次)。runner 有 admin 权限,直接改。
          netsh int ipv4 set dynamicport tcp start=1025 num=64510
          netsh int ipv4 set dynamicport udp start=1025 num=64510
          # TIME_WAIT 120s → 30s(注册表,重启栈后生效;min=30)
          Set-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Services\Tcpip\Parameters" -Name TcpTimedWaitDelay -Value 30 -Type DWord
          Write-Host "dynamic port: 1025-65534, TIME_WAIT=30s"
      - name: Build harness
        run: cargo build --release -p xray-stress
      - name: Run stress (${{ matrix.label }}-${{ matrix.batch }})
        shell: pwsh
        run: |
          # ulimit 已在 Raise FD limit step 提到 524288(Linux/macOS),Windows 不限
          $nofile = if ($IsLinux -or $IsMacOS) { & bash -c 'ulimit -n' } else { (Get-Process -Id $PID).Handle }
          Write-Host "nofile (best-effort): $nofile"
          $hours = if ($env:HOURS_OVERRIDE) { [int]$env:HOURS_OVERRIDE } else { if ("${{ inputs.hours }}") { [int]"${{ inputs.hours }}" } else { 5 } }
          if ("${{ matrix.batch }}" -eq "a") { $batch = "s1,s2,s3,s4,s5,s6" }
          elseif ("${{ matrix.batch }}" -eq "b") { $batch = "s7,s8,s9,s10,s11,s12" }
          else { $batch = "s1,s2,s3,s4,s5,s6,s7,s8,s9,s10,s11,s12" }
          Write-Host "batch: $batch, hours: $hours"
          ./target/release/xray-stress `
            --duration ($hours * 3600) `
            --concurrency 8 --s2-conns 4 `
            --scenarios $batch `
            --sample-interval 30 `
            --drain-secs 360 `
            --out-dir stress-out
      # 泄漏门禁：fd/RSS 斜率判定，超阈非零退出 → job 红。
      # 360s drain 窗覆盖 s12 connIdle 300s；RSS 负载期超阈但有 drain 回落 = 固有堆积放行。
      # 阈值调整见 tools/check_stress_leak.py 头注释（默认锚定 docs/impl-stress-leak-* 实测）。
      - name: Leak gate (fd/RSS slope)
        shell: bash
        run: python tools/check_stress_leak.py --csv stress-out/metrics.csv
      - name: Upload results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stress-${{ matrix.label }}-${{ matrix.batch }}
          path: |
            stress-out/summary.md
            stress-out/metrics.csv
            stress-out/summary-latest.md
