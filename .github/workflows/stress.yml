# 跨平台长跑压测（macOS 单 job 6h 内 + ubuntu 6h 档；手动触发）。
# 产物：summary.md + metrics.csv 上传 artifact。
# iOS/Android 不跑压测（无 runner，Mobile Gates 编译门维持现状）。
name: stress

on:
  workflow_dispatch:
    inputs:
      hours:
        description: 'Run duration in hours (job timeout = hours*60 + 90min build margin)'
        required: false
        default: '5'

jobs:
  stress:
    timeout-minutes: 390  # 6h 硬顶（5h run + build margin）；GitHub 平台 6h/job 墙更硬，hours 必须 ≤5
    strategy:
      fail-fast: false
      matrix:
        # 分批跑：12 场景 all 并发时 5 个短连接风暴场景(s1/s5/s7/s8/s11)挤兑 ephemeral 端口预算，
        # 实测(run 35558871262)各 fail 15 万次成功仅数百；两批各 6 场景避开
        include:
          - os: macos-14
            label: macos
            batch: a
          - os: macos-14
            label: macos
            batch: b
          - os: ubuntu-latest
            label: linux
            batch: a
          - os: ubuntu-latest
            label: linux
            batch: b
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # boringssl cmake 配置需要 go（macos-14 镜像缺省无 go）
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Install protoc
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get update -q && sudo apt-get install -y -q protobuf-compiler
          else
            brew install protobuf
          fi
      - uses: ./.github/actions/setup-boringssl
      - name: Build harness
        run: cargo build --release -p xray-stress
      - name: Run stress (${{ matrix.label }}-${{ matrix.batch }})
        shell: bash
        run: |
          # 12 场景 all 并发需要大量 FD（每场景 2 xray 实例+echo+socks+千级连接），
          # CI runner 默认 nofile（Linux 1024/macOS 更低）会 EMFILE 耗尽→echo 拒连
          ulimit -n 65535 2>/dev/null || ulimit -n $(ulimit -Hn) 2>/dev/null || true
          echo "nofile soft limit: $(ulimit -n)"
          hours="${{ inputs.hours }}"
          [ -z "$hours" ] && hours=5
          if [ "${{ matrix.batch }}" = "a" ]; then batch="s1,s2,s3,s4,s5,s6"; else batch="s7,s8,s9,s10,s11,s12"; fi
          ./target/release/xray-stress \
            --duration $((hours * 3600)) \
            --concurrency 8 --s2-conns 4 \
            --scenarios "$batch" \
            --sample-interval 30 \
            --out-dir stress-out
      - name: Upload results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stress-${{ matrix.label }}-${{ matrix.batch }}
          path: |
            stress-out/summary.md
            stress-out/metrics.csv
            stress-out/summary-latest.md
