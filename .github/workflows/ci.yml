# Xray-core-rust CI 流水线

# xdrive 覆盖登记（bd yc54c G1/G6）：传输互通冒烟走 interop.yml 的 extra 套件
# （dist/interop_ci.py 的 EXTRA_PROTOS 含 xdrive——service=local 共享文件夹
# rendezvous，mock 级零外网依赖；Go 基线不支持的方向由 runtime 探测自动跳过）。
# 本文件不重复挂 xdrive 冒烟：全量二进制互通属 interop.yml 职责，在此重复挂 =
# 双份 btls 全量构建成本。Windows 腿缺口见 crates/xray-transport-xdrive/src/
# local.rs 的 fail-visible 登记（共享冲突重试路径零 CI 覆盖，仅真机可证）。

name: CI

on:
  push:
    branches: [main, dev, master, 'feature/**']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # 注意：不再用空 RUSTFLAGS 覆盖 .cargo/config.toml——该文件用
  # cfg(target_arch="x86_64") 分目标声明（bd f39e：AES-NI 等特性），
  # aarch64/arm 交叉编译天然不命中该 cfg，安全。

jobs:
  # 格式检查
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # udf-frame 拉料（不锁 rev 消费 main 最新；含上游 CI 闸，依据见 action 头）
      - uses: ./.github/actions/fetch-udf
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable 分支头（2026-11-07 解析）
        with:
          components: rustfmt
      # 不能用 `cargo fmt --all`：它会把 crates/udf-frame（workspace excluded 的
      # path 依赖，CI 拉的是上游 main 最新）也纳入格式化面，排版责任属上游仓、
      # 且本仓 rustfmt.toml 会覆盖其排版 → 恒红。按 workspace 成员逐个检查
      # （metadata --no-deps 只列成员，天然排除 udf-*）。
      - name: Format check (workspace members)
        run: |
          set -euo pipefail
          for c in $(cargo metadata --no-deps --format-version 1 | jq -r '.packages[].name'); do
            cargo fmt -p "$c" -- --check
          done

  # Clippy 静态分析
  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # udf-frame 拉料（不锁 rev 消费 main 最新；含上游 CI 闸，依据见 action 头）
      - uses: ./.github/actions/fetch-udf
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable 分支头（2026-11-07 解析）
        with:
          components: clippy
      # udf 是 path 依赖且不锁 rev、Cargo.lock 无版本记录：不把 UDF_HEAD 注入
      # 缓存键 = 旧 udf 产物跨 run 复用（缓存串味假绿通道，拍板清单 §9 P0-9.4）
      - uses: Swatinem/rust-cache@2201cc584a476d1b508be977bbe4b7d1c7a52e9c # v2.9.3
        with:
          key: ${{ env.UDF_HEAD }}
      # workspace 依赖图含 xray-proto(prost-build)，构建需要 protoc
      - name: Install protoc
        run: sudo apt-get update -q && sudo apt-get install -y -q protobuf-compiler
      # btls-sys bindings 含注入符号（bd mygg/z32z），与 interop/mobile 同源
      # 配方；顺序须在 rust-cache 之后（action 尾部清理恢复的旧 btls-sys 产物）
      - uses: ./.github/actions/setup-boringssl
      - run: cargo clippy --workspace --all-targets -- -D warnings

  # 编译检查 (多平台)
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # linux 钉 22.04：产物换核生产 Debian 12（glibc 2.36），24.04 构建要求
          # GLIBC_2.38 起不来（2026-10-11 实锤回滚）；与 release.yml 同理由
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # udf-frame 拉料（不锁 rev 消费 main 最新；含上游 CI 闸，依据见 action 头）
      - uses: ./.github/actions/fetch-udf
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable 分支头（2026-11-07 解析）
      # dtolnay/rust-toolchain v2 with.targets 失效兜底;host runner 默认 target 通常装好,
      # 但显式 add 保持与 release.yml / mobile.yml 一致,防未来 runner 镜像变化
      - name: Ensure target installed
        run: rustup target add ${{ matrix.target }}
      # prefix-key 防 24.04→22.04 跨 OS 缓存污染（2026-10-09 release.yml 实锤：
      # 默认 key 不含 runner OS，旧 OS 的 aws_lc_sys .o 恢复进新 OS 链接必炸）
      - uses: Swatinem/rust-cache@2201cc584a476d1b508be977bbe4b7d1c7a52e9c # v2.9.3
        with:
          prefix-key: build-v2-2204
          key: ${{ env.UDF_HEAD }}
      # workspace 依赖图含 xray-proto(prost-build)，构建需要 protoc（runner 镜像已不再预装）
      - name: Install protoc
        shell: pwsh
        run: |
          if ($env:RUNNER_OS -eq "Linux") {
            # ubuntu-22.04 默认 protobuf-compiler 3.12 不支持 proto3 optional
            # （2026-10-11 CI 38110136668 实锤）；装 25.1 到 /usr/local（apt 旧版被覆盖）
            sudo apt-get update -qq
            sudo apt-get install -y -qq unzip wget
            sudo wget -q https://github.com/protocolbuffers/protobuf/releases/download/v25.1/protoc-25.1-linux-x86_64.zip -O /tmp/protoc.zip
            sudo unzip -q -o /tmp/protoc.zip -d /usr/local
            sudo rm /tmp/protoc.zip
          } elseif ($env:RUNNER_OS -eq "macOS") {
            brew install protobuf
          } else {
            # choco 的 protoc 包 exit 0 但 shim 不落 C:\ProgramData\chocolatey\bin
            # （2026-10-24 run 40048205742 实证：Install 步绿，cargo 仍报
            #  Could not find `protoc`）→ 直接取官方 win64 zip，与 Linux 分支同版本。
            $ver = "25.1"
            Invoke-WebRequest -UseBasicParsing `
              -Uri "https://github.com/protocolbuffers/protobuf/releases/download/v$ver/protoc-$ver-win64.zip" `
              -OutFile "$env:RUNNER_TEMP\protoc.zip"
            Expand-Archive -Path "$env:RUNNER_TEMP\protoc.zip" -DestinationPath "$env:RUNNER_TEMP\protoc" -Force
            echo "$env:RUNNER_TEMP\protoc\bin" | Out-File -FilePath $env:GITHUB_PATH -Append
            & "$env:RUNNER_TEMP\protoc\bin\protoc.exe" --version
          }
      # btls-sys bindings 含注入符号（bd mygg/z32z），与 interop/mobile 同源
      # 配方；顺序须在 rust-cache 之后（action 尾部清理恢复的旧 btls-sys 产物）
      - uses: ./.github/actions/setup-boringssl
      # bd ga42a：Windows 上 btls-sys 无条件 OPENSSL_NO_ASM → BoringSSL 无汇编 →
      # 带 fingerprint 的客户端吞吐塌到 31.6 MB/s（带汇编 241.2，7.6×）。CI 的
      # Windows 产物（xray-windows-amd64.exe / artifact）与 release 资产等价，
      # 不能是慢的那个 → 这里编带汇编的 BoringSSL 供 cargo 走预构建路线。
      # 仅 Windows（其他平台 btls-sys 不设 NO_ASM）。
      - name: Prepare ASM boringssl (Windows)
        if: matrix.target == 'x86_64-pc-windows-msvc'
        uses: ./.github/actions/setup-boringssl-asm
      - run: cargo build --workspace --release
      - run: cargo build --workspace
      # 常态测试流程：CI 绿后从 artifact 下载对应平台二进制测试（发版需用户同意，
      # 测试阶段不打 tag）；同 commit 功能与 release 资产等价
      - name: Upload xray binary (per-platform)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: xray-${{ matrix.target }}
          path: |
            target/release/xray
            target/release/xray.exe

  # 测试
  test:
    name: Test
    runs-on: ubuntu-latest
    # bd fu2ck：release 阶段冷编实测 >103 分钟仍未完（-j2，runner 4vCPU/16GB）。
    # 根因不是「跑不完」，而是**本作业从未成功过** ⇒ Swatinem/rust-cache 只在作业
    # 成功时保存 ⇒ release 产物每次都进不了缓存 ⇒ 每次都从零冷编 ⇒ 每次都超时，
    # 自我锁死。给作业加上界（180min，实测冷编 ~140min）让它跑完并把缓存落下来；
    # 之后各轮的 release 阶段走缓存（约 20min 量级）。
    timeout-minutes: 180
    # bd k2hf7：xray-core inbound 深轮询链（serve_mixed → per-conn task → UDP
    # associate）在 debug 构建下距 std 默认 2MB 测试线程栈只剩一层透传帧（现役
    # 防线仅 xray-frame scope.rs ArmScope::spawn 的 #[inline(always)]，属编译期
    # 决策非结构约束）——再叠一层调用即进程级 STATUS_STACK_OVERFLOW（整测试二进制
    # 被杀，非单测失败）。16MB = 8× 余量；代价只是线程栈虚拟预留、按需提交页。
    env:
      RUST_MIN_STACK: 16777216
      # 2026-11-08 三次实证：`cargo test --workspace --release` 在 release 编译期
      # 被 runner SIGTERM(143) 提前终止（job 每次 ~24min；debug 步骤全绿、无 ENOSPC/OOM
      # 日志、无 job 超时/并发取消）——按峰值内存/链接并发收敛为 2 路编译缓解。
      # 注：旧注释写的「编译 xray-integration-tests 期间」指向的 crate **并不存在**
      # （工作区无此成员，集成测试散在各 crate 的 tests/ 下）——已更正为「release 编译期」。
      # 不放宽任何断言与测试内容（仅编译并发）。
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # udf-frame 拉料（不锁 rev 消费 main 最新；含上游 CI 闸，依据见 action 头）
      - uses: ./.github/actions/fetch-udf
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable 分支头（2026-11-07 解析）
      - uses: Swatinem/rust-cache@2201cc584a476d1b508be977bbe4b7d1c7a52e9c # v2.9.3
        with:
          key: ${{ env.UDF_HEAD }}
      # workspace 依赖图含 xray-proto(prost-build)，test 构建需要 protoc
      - name: Install protoc
        run: sudo apt-get update -q && sudo apt-get install -y -q protobuf-compiler
      # btls-sys bindings 含注入符号（bd mygg/z32z），与 interop/mobile 同源
      # 配方；顺序须在 rust-cache 之后（action 尾部清理恢复的旧 btls-sys 产物）
      - uses: ./.github/actions/setup-boringssl
      # bd 88m0：缺省 SO_RCVBUF 4MB 测试断言需要 rmem_max ≥ 8MB（stock 内核
      # 212992 会静默钳制 setsockopt；生产主机同样需要此调优）
      - name: Raise rmem_max for SO_RCVBUF tests
        run: sudo sysctl -w net.core.rmem_max=8388608 net.core.wmem_max=8388608
      - run: cargo test --workspace
      - run: cargo test --workspace --release

  # Windows 平台测试门（ft58 B1 / G-17）：xray-proxy-tun 单 crate。
  # 依赖闭包实测（cargo tree -e normal,build,dev --target x86_64-pc-windows-msvc）：
  # 无 btls-sys → 不挂 setup-boringssl、零 BORING_* 环境变量；rustls provider =
  # ring 0.17（非 aws-lc-sys），windows runner 镜像预装 NASM 自给自足；
  # 含 prost-build（xray-proto 传递）→ 需要 protoc。
  test-windows-tun:
    name: Test (windows, xray-proxy-tun)
    runs-on: windows-latest
    timeout-minutes: 30
    # bd k2hf7：同 test job——测试线程栈兜底（16MB = std 默认 2MB 的 8×）
    env:
      RUST_MIN_STACK: 16777216
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # udf-frame 拉料（workspace manifest 解析需 crates/udf-frame 存在，tun 才是测试目标）
      - uses: ./.github/actions/fetch-udf
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable 分支头（2026-11-07 解析）
      # 独立 prefix-key：不与 build job 的 build-v2-2204 缓存互串
      - uses: Swatinem/rust-cache@2201cc584a476d1b508be977bbe4b7d1c7a52e9c # v2.9.3
        with:
          prefix-key: test-win-tun-v1
          key: ${{ env.UDF_HEAD }}
      # 依赖闭包含 xray-proto(prost-build)，测试构建需要 protoc（与 build job Windows 分支同配方：
      # choco 的 protoc 包不落 shim，改取官方 win64 zip）
      - name: Install protoc
        shell: pwsh
        run: |
          $ver = "25.1"
          Invoke-WebRequest -UseBasicParsing `
            -Uri "https://github.com/protocolbuffers/protobuf/releases/download/v$ver/protoc-$ver-win64.zip" `
            -OutFile "$env:RUNNER_TEMP\protoc.zip"
          Expand-Archive -Path "$env:RUNNER_TEMP\protoc.zip" -DestinationPath "$env:RUNNER_TEMP\protoc" -Force
          echo "$env:RUNNER_TEMP\protoc\bin" | Out-File -FilePath $env:GITHUB_PATH -Append
          & "$env:RUNNER_TEMP\protoc\bin\protoc.exe" --version
      - run: cargo test -p xray-proxy-tun --all-targets

  # bd 1gkcf：DKD-TPROXY 语义锚要真跑「特权分支」。
  # crates/xray-proxy-dokodemo/tests/plugin_contract.rs 的
  # tproxy_gate_is_runtime_semantics_not_compiled_away 在 Linux 有两种合法态：
  #   非特权 → fake_udp 返回 PermissionDenied（setsockopt IP_TRANSPARENT 被拒）
  #   特权（root + CAP_NET_ADMIN）→ fake_udp 成功，且必须在**当前 tokio reactor** 内可收发
  # 现役 Test job 是非特权的（永远走 EPERM 那一支）——特权支路一旦回归（波4 G9 前的
  # 裸 #[test] 越界到 from_std → "no reactor running" panic）CI 依然是绿的（假绿）。
  # 本 job 用 sudo 跑同一条测试：hosted runner 是整机 VM，root 保有 CAP_NET_ADMIN，
  # 因此不需要 docker——容器默认丢 CAP_NET_ADMIN，那才必须 `--privileged -v /dev/net/tun`。
  # 该测试打的是 IP_TRANSPARENT **UDP** socket，不打开 /dev/net/tun，故不挂 tun 设备。
  # 前置探针显式断言能力在场：能力缺失时 job 红，而不是静默退化成非特权假绿。
  test-linux-privileged-tproxy:
    name: Test (linux, privileged tproxy gate)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # udf-frame 拉料（workspace manifest 解析需要，与其他 job 同源）
      - uses: ./.github/actions/fetch-udf
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable 分支头（2026-11-07 解析）
      # 独立 prefix-key：不与其他 job 缓存互串
      - uses: Swatinem/rust-cache@2201cc584a476d1b508be977bbe4b7d1c7a52e9c # v2.9.3
        with:
          prefix-key: test-linux-priv-tproxy-v1
          key: ${{ env.UDF_HEAD }}
      # 依赖闭包含 xray-proto(prost-build)，构建需要 protoc
      - name: Install protoc
        run: sudo apt-get update -q && sudo apt-get install -y -q protobuf-compiler
      # btls-sys bindings 含注入符号（bd mygg/z32z），与 test/clippy 同源配方；
      # 顺序须在 rust-cache 之后（action 尾部清理恢复的旧 btls-sys 产物）
      - uses: ./.github/actions/setup-boringssl
      # 能力探针：IP_TRANSPARENT(19) 的 setsockopt 需要 CAP_NET_ADMIN，缺则 job 红
      - name: Preflight — CAP_NET_ADMIN (IP_TRANSPARENT)
        run: |
          sudo python3 - <<'PY'
          import socket, sys
          s = socket.socket(socket.AF_INET, socket.SOCK_DGRAM)
          try:
              s.setsockopt(socket.IPPROTO_IP, 19, 1)  # IP_TRANSPARENT
          except OSError as e:
              sys.exit("::error::root 缺 CAP_NET_ADMIN（IP_TRANSPARENT: %s）——特权 job 会退化成非特权假绿" % e)
          print("CAP_NET_ADMIN 可用：IP_TRANSPARENT setsockopt 成功")
          PY
      # 只跑这一条：整文件在特权下会连带跑其它契约夹具，超出本票要验证的语义锚
      - name: Run tproxy gate as root (privileged branch)
        run: >
          sudo --preserve-env=RUSTUP_HOME,CARGO_HOME,RUST_MIN_STACK
          "$(command -v cargo)"
          test -p xray-proxy-dokodemo --test plugin_contract
          tproxy_gate_is_runtime_semantics_not_compiled_away -- --exact --nocapture

  # bd c4ueq：Go/Rust 入站解析器差分对拍门——同一原始字节流打 Go「裁定基准」与
  # 本仓 Rust 的 mixed 入站，比接受/拒绝、响应字节（HTTP 侧剥 Date）与连接关闭方式
  # 三维判据；allowlist 外任何差异即红（已知残留差异逐条带理由显式放行，不静默绿）。
  # 协议语义漂移自动发现。
  # 基准版本不再写在本 job：统一由 ./.github/actions/fetch-go-baseline 提供
  # （bd t3wtj：基准 = v26.10.17 的 commit，上游无该版本 release asset，故按 commit 构建）。
  # harness：dist/parser_parity/parity.py（母本 reports/audit-2026-10-29/tmp/），
  # 确定性 = 127.0.0.1 固定高位端口 + 源站为本地 python（origin.py）+ 零外网依赖。
  parser-parity:
    name: Parser Parity (Go ruling baseline vs Rust)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # udf-frame 拉料（workspace manifest 解析需要，与其他 job 同源）
      - uses: ./.github/actions/fetch-udf
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable 分支头（2026-11-07 解析）
      # 独立 prefix-key：不与其他 job 缓存互串；UDF_HEAD 防 udf 产物串味假绿
      - uses: Swatinem/rust-cache@2201cc584a476d1b508be977bbe4b7d1c7a52e9c # v2.9.3
        with:
          prefix-key: parser-parity-v1
          key: ${{ env.UDF_HEAD }}
      # 依赖闭包含 xray-proto(prost-build)，构建需要 protoc
      - name: Install protoc
        run: sudo apt-get update -q && sudo apt-get install -y -q protobuf-compiler
      # btls-sys bindings 含注入符号（bd mygg/z32z），与 test/clippy 同源配方；
      # 顺序须在 rust-cache 之后（action 尾部清理恢复的旧 btls-sys 产物）
      - uses: ./.github/actions/setup-boringssl
      - name: Build Rust xray (debug)
        run: cargo build -p xray-cli --bin xray
      # Go 参照 = 裁定基准（版本/commit 只在本 action 里出现一次，bd t3wtj）
      - uses: ./.github/actions/fetch-go-baseline
      - name: Parser parity matrix (HTTP 38 + SOCKS5 19)
        env:
          # debug Rust 服务端任务同样吃线程栈（bd k2hf7 同族），env 会继承进 xray 进程
          RUST_MIN_STACK: 16777216
        run: >-
          python3 dist/parser_parity/parity.py
          --go-bin "$GO_BASELINE_BIN"
          --rust-bin target/debug/xray
      - name: Upload parity evidence on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: parser-parity-logs
          path: target/parser_parity/
          if-no-files-found: ignore

  # 安全与许可证审计
  audit:
    name: Security & License
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # udf-frame 拉料：cargo-deny 需解析 workspace manifest，缺料即红
      - uses: ./.github/actions/fetch-udf
      - uses: EmbarkStudios/cargo-deny-action@c3bbe7e4e3f7baeee1a3dd9aec0a3b2aded580fb # v2.1.1
      # osv-scanner：GHSA/CVE 基线扫描（gqkk 供应链票，与 cargo-deny 的 RustSec 面
      # 互补）。**阻断级**（bd 审计 P2-1）：已知无 fix 的命中逐条登记在
      # `osv-scanner.toml` 的 [[IgnoredVulns]]（含 reason），未登记的新命中即红。
      # 文件名必须无点前缀：osv-scanner v2 只在 cwd 发现 `osv-scanner.toml`
      # （manager.go:106），`.osv-scanner.toml` 不会被读取 ⇒ 豁免空转、阻断门假红。
      # 供应链：版本 + SHA256 双钉（原先从 releases/latest 下载后直接执行 = 上游投毒
      # 或传输劫持即可在 CI 跑任意代码）。升级版本时同步改 OSV_VERSION 与 OSV_SHA256
      # （后者取自同版本 release 的 osv-scanner_SHA256SUMS）。
      - name: osv-scanner (CVE/GHSA baseline)
        env:
          OSV_VERSION: v2.7.0
          OSV_SHA256: 160c6253e2922e9e0a6a9771c5c4c40a4b3c6090b34a3cdd5e80c96cc2e4218b
        run: |
          set -euo pipefail
          curl -sSfL "https://github.com/google/osv-scanner/releases/download/${OSV_VERSION}/osv-scanner_linux_amd64" -o /usr/local/bin/osv-scanner
          echo "${OSV_SHA256}  /usr/local/bin/osv-scanner" | sha256sum -c -
          chmod +x /usr/local/bin/osv-scanner
          osv-scanner scan --lockfile=Cargo.lock --format=table

  # 文档构建
  docs:
    name: Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # udf-frame 拉料（不锁 rev 消费 main 最新；含上游 CI 闸，依据见 action 头）
      - uses: ./.github/actions/fetch-udf
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable 分支头（2026-11-07 解析）
      - uses: Swatinem/rust-cache@2201cc584a476d1b508be977bbe4b7d1c7a52e9c # v2.9.3
        with:
          key: ${{ env.UDF_HEAD }}
      - name: Install protoc
        run: sudo apt-get update -q && sudo apt-get install -y -q protobuf-compiler
      # btls-sys bindings 含注入符号（bd mygg/z32z）；rustdoc 构建依赖同样过 btls-sys
      - uses: ./.github/actions/setup-boringssl
      - run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  # Fuzz smoke（cargo-fuzz）：仅在手动触发时运行，不阻塞主干 PR。
  # 每靶 30s 冒烟：发现 crash 即失败；不做 OOM/depth 调优。
  fuzz:
    name: Fuzz Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # fuzz 工作区依赖主 workspace 的 manifest（xray-* path 依赖要能解析），
      # 而 crates/xray-common 等已接 udf crate → 缺料即 setup-boringssl 阶段
      # 报 `failed to get udf-skeleton-infra`（2026-10-24 run 40048205742 实证）。
      - uses: ./.github/actions/fetch-udf
      - uses: dtolnay/rust-toolchain@2c76c034f9e32a5d6e2c104dc4df23a22476db04 # nightly 分支头（2026-11-07 解析）
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      # fuzz target 依赖链含 xray-proto(prost-build)，构建需要 protoc
      - name: Install protoc
        run: sudo apt-get update -q && sudo apt-get install -y -q protobuf-compiler
      - uses: Swatinem/rust-cache@2201cc584a476d1b508be977bbe4b7d1c7a52e9c # v2.9.3
        with:
          workspaces: |
            fuzz
      # btls-sys bindings 含注入符号（bd mygg/z32z）；fuzz 链含 xray-reality。
      # fuzz/target 的旧 btls-sys 缓存由 env fingerprint 变化触发 build script
      # 重跑自动重建（rerun-if-env-changed 覆盖 ASSUME_PATCHED/SOURCE_PATH）
      - uses: ./.github/actions/setup-boringssl
      - name: Build fuzzers
        working-directory: fuzz
        run: cargo fuzz build --sanitizer address
      - name: Smoke run (30s per target)
        working-directory: fuzz
        run: |
          for t in kcp_segment ss2022_packet vless_inbound; do
            echo "=== $t ==="
            cargo fuzz run "$t" -- -max_total_time=30 -rss_limit_mb=4096 -max_len=8192
          done

  # proto 镜像漂移门：protos/ 只准从 Go 基线 rsync 同步，手改即挂（protos/README.md 纪律）
  proto-drift:
    name: Proto Drift Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: python3 tools/check_proto_drift.py --manifest

  # 资产门（G-18）：对齐 Go test.yml:10 check-assets，但语义按本仓架构改写——
  # 本仓不内置 geodata（运行时下载，crates/xray-app-geodata），无 cache 可恢复，
  # 故不照搬 Go 的「缺失 sleep 90s」，改为硬门：受控配置一旦引用 geo 资产而
  # 资产目录无该文件即 fail（否则二进制起得来但路由规则静默失效）。
  check-assets:
    name: Asset Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: python3 tools/check_geo_assets.py

  # 框架路编译门（ARCH-01 / bd gjqm7 G1，je3u3 ①）：目标主路（xray-cli
  # --features framework-assembly 组合根）此前在 CI 里一次都不被编译（全量
  # grep --features = 0 命中），本地绿只因恰好有人跑过。本 job 只增不减——
  # 不改既有 job 语义。缓存键与 clippy job 同源（UDF_HEAD 防 udf 产物串味）。
  framework-assembly:
    name: Framework Assembly (clippy + lib test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # udf-frame 拉料（workspace manifest 解析需要，与其他 job 同源）
      - uses: ./.github/actions/fetch-udf
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable 分支头（2026-11-07 解析）
        with:
          components: clippy
      - uses: Swatinem/rust-cache@2201cc584a476d1b508be977bbe4b7d1c7a52e9c # v2.9.3
        with:
          prefix-key: fw-assembly-v1
          key: ${{ env.UDF_HEAD }}
      # 依赖闭包含 xray-proto(prost-build)，构建需要 protoc
      - name: Install protoc
        run: sudo apt-get update -q && sudo apt-get install -y -q protobuf-compiler
      # btls-sys bindings 含注入符号（bd mygg/z32z）；顺序须在 rust-cache 之后
      # （action 尾部清理恢复的旧 btls-sys 产物）
      - uses: ./.github/actions/setup-boringssl
      - run: cargo clippy -p xray-cli --features framework-assembly --all-targets -- -D warnings
      - run: cargo test -p xray-cli --features framework-assembly --lib

  # 质量门四件套（je3u3 ②，tools/check_quality_gates.py）：失败留痕（禁
  # hot_log!(DEBUG, "error=…")，白名单 1 条瞬断重放）/ 抑制登记（allow 带
  # 理由 + unused_imports 恒 0）/ 登记簿漂移（跑 memory_budget 交叉断言）/
  # 注释漂移抽查。静态门无需 cargo；(c) 需要——与 test job 同源配方。
  quality-gates:
    name: Quality Gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/fetch-udf
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable 分支头（2026-11-07 解析）
      - uses: Swatinem/rust-cache@2201cc584a476d1b508be977bbe4b7d1c7a52e9c # v2.9.3
        with:
          prefix-key: quality-gates-v1
          key: ${{ env.UDF_HEAD }}
      - name: Install protoc
        run: sudo apt-get update -q && sudo apt-get install -y -q protobuf-compiler
      - uses: ./.github/actions/setup-boringssl
      - run: python3 tools/check_quality_gates.py

  # 生产代码禁裸 UdpSocket::bind / socket2 Type::DGRAM 静态门（bd d597w 的门，bd v2p1x
  # 补接线：门写了不跑 = 没门）。纯文本扫描，无需 cargo/protoc/btls，秒级。
  udp-binds:
    name: UDP Bind Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: python3 tools/check_udp_binds.py --self-test
      - run: python3 tools/check_udp_binds.py
