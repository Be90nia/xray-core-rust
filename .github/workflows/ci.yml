# Xray-core-rust CI 流水线

name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # 覆盖 .cargo/config.toml 的 target-cpu=native（bd hxy3）：CI 产物必须保持
  # 通用 target 生成（用户老机器 SIGILL 防线），交叉编译 job 不受 native 污染。
  # RUSTFLAGS env 存在时完全覆盖 build.rustflags（cargo 语义：二选一）。
  RUSTFLAGS: ""

jobs:
  # 格式检查
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  # Clippy 静态分析
  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  # 编译检查 (多平台)
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --release
      - run: cargo build --workspace

  # 测试
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace
      - run: cargo test --workspace --release

  # 安全与许可证审计
  audit:
    name: Security & License
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2

  # 文档构建
  docs:
    name: Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  # Fuzz smoke（cargo-fuzz）：仅在手动触发时运行，不阻塞主干 PR。
  # 每靶 30s 冒烟：发现 crash 即失败；不做 OOM/depth 调优。
  fuzz:
    name: Fuzz Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            fuzz
      - name: Build fuzzers
        working-directory: fuzz
        run: cargo fuzz build --sanitizer address
      - name: Smoke run (30s per target)
        working-directory: fuzz
        run: |
          for t in kcp_segment ss2022_packet vless_inbound; do
            echo "=== $t ==="
            cargo fuzz run "$t" -- -max_total_time=30 -rss_limit_mb=4096 -max_len=8192
          done
