name: Release

on:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always
  # 覆盖 .cargo/config.toml 的 target-cpu=native（bd hxy3）：发行产物给公网
  # 用户下载，必须通用 target 生成（老机器 SIGILL 防线）；RUSTFLAGS env 完全
  # 覆盖 build.rustflags（cargo 语义）。
  RUSTFLAGS: ""

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: xray-linux-amd64
            bin: xray
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: xray-windows-amd64.exe
            bin: xray.exe
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: xray-macos-amd64
            bin: xray
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: xray-macos-arm64
            bin: xray
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Prepare patched boringssl
        uses: ./.github/actions/setup-boringssl
      - name: Install protoc
        shell: pwsh
        run: |
          if ($env:RUNNER_OS -eq "Linux") {
            sudo apt-get update -qq && sudo apt-get install -y -qq protobuf-compiler
          } elseif ($env:RUNNER_OS -eq "macOS") {
            brew install protobuf
          } else {
            # Windows: 依赖图含 xray-proto(prost-build)需要 protoc（同 stress.yml）
            choco install -y protoc 2>&1 | Out-Null
            echo "C:\ProgramData\chocolatey\bin" | Out-File -FilePath $env:GITHUB_PATH -Append
          }
          Write-Host "protoc: $(protoc --version)"
      - name: Build release
        run: cargo build --release -p xray-cli --target ${{ matrix.target }}
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: target/${{ matrix.target }}/release/${{ matrix.bin }}

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      # 四平台二进制同叫 xray/xray.exe，artifacts/** 直接上传会同名互相覆盖
      # （v26.9.9 首发实锤只剩 2 个文件）——先拍平重命名为 artifact 名。
      - name: Rename artifacts
        run: |
          mkdir -p dist
          for d in artifacts/*/; do
            name=$(basename "$d")
            cp "$d"/* "dist/$name"
          done
          ls -la dist/
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/**
          generate_release_notes: true
