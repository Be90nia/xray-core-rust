name: Release

on:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always
  # 覆盖 build.rustflags（cargo 语义）。
  # 注意：不再用空 RUSTFLAGS 覆盖 .cargo/config.toml——该文件用
  # cfg(target_arch="x86_64") 分目标声明（bd f39e：AES-NI 等特性），
  # aarch64/arm 交叉编译天然不命中该 cfg，安全。
  # aws-lc-sys 预编译产物含 glibc 2.38+ 符号（__isoc23_*），VPS Debian 12 (2.36)
  # 跑不动；强制源码编译让本地 gcc 出普通 sscanf 引用（生产换核 a2aae6cf 战役）
  AWS_LC_SYS_PREGENERATING: "false"

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            artifact: xray-linux-amd64
            bin: xray
          # OpenWrt/iStoreOS 系 musl 固件原生静态二进制(zig 交叉配方探针实证 38024052697)
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-musl
            artifact: xray-linux-amd64-musl
            bin: xray
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: xray-windows-amd64.exe
            bin: xray.exe
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: xray-macos-amd64
            bin: xray
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: xray-macos-arm64
            bin: xray
    steps:
      - uses: actions/checkout@v4
      # udf-frame 拉料（不锁 rev 消费 main 最新；含上游 CI 闸，依据见 action 头）
      - uses: ./.github/actions/fetch-udf
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      # 兜底（同 ci.yml）：仓库 rust-toolchain.toml 钉 nightly-2026-05-28，实际编译用的
      # 是该 channel；上游 action 的 with.targets 只对它安装的 stable 生效，交叉目标
      # （linux-musl / macos-x64）因此缺 std → "can't find crate for `core`"。
      # 用 rustup target add 走**当前生效**工具链。
      - name: Ensure target installed for pinned toolchain
        run: rustup target add ${{ matrix.target }}
      # prefix-key 炸缓存：旧 key 里混着 ubuntu-24.04（glibc 2.39）编的 aws_lc_sys
      # 产物（sscanf→__isoc23_* 重定向），恢复进 22.04 链接必炸——强制全量重编

      # udf 是 path 依赖且不锁 rev、Cargo.lock 无版本记录：不把 UDF_HEAD 注入
      # 缓存键 = 旧 udf 产物跨 run 复用（缓存串味假绿通道，拍板清单 §9 P0-9.4）
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "v2-gcc22-glibc235"
          key: ${{ env.UDF_HEAD }}
      - name: Prepare patched boringssl
        uses: ./.github/actions/setup-boringssl
      # bd ga42a：Windows 上 btls-sys 无条件 OPENSSL_NO_ASM → BoringSSL 无汇编 →
      # AES-NI 探测恒 false → 协商 CHACHA20 且纯 C 回退 → 带 fingerprint 的客户端
      # 吞吐塌到 31.6 MB/s（本地带汇编构建 241.2，7.6×）。**发出去的 Windows 产物
      # 就是慢的那个** → 这里编一份带汇编的 BoringSSL 并让 cargo 走预构建路线。
      # 仅 Windows（Linux/macOS 的 btls-sys 不设 NO_ASM，汇编本来就在）。
      - name: Prepare ASM boringssl (Windows)
        if: matrix.target == 'x86_64-pc-windows-msvc'
        uses: ./.github/actions/setup-boringssl-asm
      - name: Install protoc
        shell: pwsh
        run: |
          if ($env:RUNNER_OS -eq "Linux") {
            # ubuntu-22.04 默认 protobuf-compiler 3.12 不支持 proto3 optional
            # 装新 protoc 25.1 到 /usr/local/bin（apt 旧版被 PATH 覆盖）
            sudo apt-get update -qq
            sudo apt-get install -y -qq unzip wget
            sudo wget -q https://github.com/protocolbuffers/protobuf/releases/download/v25.1/protoc-25.1-linux-x86_64.zip -O /tmp/protoc.zip
            sudo unzip -q -o /tmp/protoc.zip -d /usr/local
            sudo rm /tmp/protoc.zip
          } elseif ($env:RUNNER_OS -eq "macOS") {
            brew install protobuf
          } else {
            # Windows: 依赖图含 xray-proto(prost-build)需要 protoc
            # choco shim 间歇未生成（Out-Null 吞错）→ 改直连下载 protoc 25.1
            $protocZip = "$env:RUNNER_TEMP\protoc.zip"
            $protocDir = "$env:RUNNER_TEMP\protoc"
            Invoke-WebRequest -Uri "https://github.com/protocolbuffers/protobuf/releases/download/v25.1/protoc-25.1-win64.zip" -OutFile $protocZip
            Expand-Archive -Path $protocZip -DestinationPath $protocDir -Force
            echo "$protocDir\bin" | Out-File -FilePath $env:GITHUB_PATH -Append
          }
          # GITHUB_PATH 对本步不生效，版本检查仅非 Windows（Linux/macOS 即时装好）
          if ($env:RUNNER_OS -ne "Windows") { Write-Host "protoc: $(protoc --version)" }
      # musl 交叉:C/C++ 依赖(boringssl/aws-lc)经 zig 工具链(探针 38024052697 实证配方)
      - name: Install zig (musl target only)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          wget -q https://ziglang.org/download/0.13.0/zig-linux-x86_64-0.13.0.tar.xz
          tar xJf zig-linux-x86_64-0.13.0.tar.xz -C /opt
          echo "/opt/zig-linux-x86_64-0.13.0" >> "$GITHUB_PATH"
          # GITHUB_PATH 对当前步不生效,下一步才消费
      - name: Install cargo-zigbuild (musl target only)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild
      - name: Build release (musl via zigbuild)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: cargo zigbuild --release -p xray-cli --target ${{ matrix.target }}
      - name: Build release
        if: matrix.target != 'x86_64-unknown-linux-musl'
        run: cargo build --release -p xray-cli --target ${{ matrix.target }}
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: target/${{ matrix.target }}/release/${{ matrix.bin }}

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # 随包文档（README.md / LICENSE）来自工作树，故 release job 需要 checkout
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      # 四平台二进制同叫 xray/xray.exe，artifacts/** 直接上传会同名互相覆盖
      # （v26.9.9 首发实锤只剩 2 个文件）——先拍平重命名为 artifact 名。
      # 必须先清空 dist/：仓库里 dist/ 还入库了 interop 脚本（interop_*.py /
      # run_all.py / uriclient.py，interop.yml 在用），package_release.py 会给
      # dist/ 里每个文件都打 zip+dgst，`files: dist/**` 再全量上传 —— v26.10.11-rust.1
      # 发布页因此混进 48 个脚本资产。发布目录只允许本次构建出的二进制。
      - name: Rename artifacts
        run: |
          rm -rf dist
          mkdir -p dist
          for d in artifacts/*/; do
            name=$(basename "$d")
            cp "$d"/* "dist/$name"
          done
          ls -la dist/
      # 资产门（G-18）在发版前再跑一次：ci.yml 只覆盖分支 push/PR，tag push 不触发，
      # 若发版分支带来引用 geo 资产的配置而包里没有 dat，二进制起得来但路由静默失效。
      - name: Check geo assets
        run: python3 tools/check_geo_assets.py
      # G-21：产物内 README+LICENSE、zip 打包、md5/sha1/sha256/sha512 dgst
      - name: Package archives + digests
        run: python3 tools/package_release.py dist
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/**
          generate_release_notes: true
