name: Release

on:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always
  # 覆盖 build.rustflags（cargo 语义）。
  # 注意：不再用空 RUSTFLAGS 覆盖 .cargo/config.toml——该文件用
  # cfg(target_arch="x86_64") 分目标声明（bd f39e：AES-NI 等特性），
  # aarch64/arm 交叉编译天然不命中该 cfg，安全。
  # aws-lc-sys 预编译产物含 glibc 2.38+ 符号（__isoc23_*），VPS Debian 12 (2.36)
  # 跑不动；强制源码编译让本地 gcc 出普通 sscanf 引用（生产换核 a2aae6cf 战役）
  AWS_LC_SYS_PREGENERATING: "false"

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            artifact: xray-linux-amd64
            bin: xray
          # OpenWrt/iStoreOS 系 musl 固件原生静态二进制(zig 交叉配方探针实证 38024052697)
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-musl
            artifact: xray-linux-amd64-musl
            bin: xray
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: xray-windows-amd64.exe
            bin: xray.exe
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: xray-macos-amd64
            bin: xray
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: xray-macos-arm64
            bin: xray
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # udf-frame 拉料（不锁 rev 消费 main 最新；含上游 CI 闸，依据见 action 头）
      - uses: ./.github/actions/fetch-udf
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable 分支头（2026-11-07 解析）
        with:
          targets: ${{ matrix.target }}
      # 兜底（同 ci.yml）：仓库 rust-toolchain.toml 钉 nightly-2026-05-28，实际编译用的
      # 是该 channel；上游 action 的 with.targets 只对它安装的 stable 生效，交叉目标
      # （linux-musl / macos-x64）因此缺 std → "can't find crate for `core`"。
      # 用 rustup target add 走**当前生效**工具链。
      - name: Ensure target installed for pinned toolchain
        run: rustup target add ${{ matrix.target }}
      # prefix-key 炸缓存：旧 key 里混着 ubuntu-24.04（glibc 2.39）编的 aws_lc_sys
      # 产物（sscanf→__isoc23_* 重定向），恢复进 22.04 链接必炸——强制全量重编

      # udf 是 path 依赖且不锁 rev、Cargo.lock 无版本记录：不把 UDF_HEAD 注入
      # 缓存键 = 旧 udf 产物跨 run 复用（缓存串味假绿通道，拍板清单 §9 P0-9.4）
      - uses: Swatinem/rust-cache@2201cc584a476d1b508be977bbe4b7d1c7a52e9c # v2.9.3
        with:
          prefix-key: "v2-gcc22-glibc235"
          key: ${{ env.UDF_HEAD }}
      - name: Prepare patched boringssl
        uses: ./.github/actions/setup-boringssl
      # bd ga42a：Windows 上 btls-sys 无条件 OPENSSL_NO_ASM → BoringSSL 无汇编 →
      # AES-NI 探测恒 false → 协商 CHACHA20 且纯 C 回退 → 带 fingerprint 的客户端
      # 吞吐塌到 31.6 MB/s（本地带汇编构建 241.2，7.6×）。**发出去的 Windows 产物
      # 就是慢的那个** → 这里编一份带汇编的 BoringSSL 并让 cargo 走预构建路线。
      # 仅 Windows（Linux/macOS 的 btls-sys 不设 NO_ASM，汇编本来就在）。
      - name: Prepare ASM boringssl (Windows)
        if: matrix.target == 'x86_64-pc-windows-msvc'
        uses: ./.github/actions/setup-boringssl-asm
      # bd jyipl + qscjv：**所有发布产物必须带汇编 BoringSSL，这不是优化项**。
      # qscjv 后缺省 TLS（用户不配 fingerprint）也走 btls（Chrome uTLS hello，
      # xray-transport-tcp/register.rs 缺省对齐 Go）——产物若 NO_ASM，**全体缺省
      # TLS 用户从 ~241 MB/s 掉到 ~31.6 MB/s（7.6×，bd jyipl 实测）= 发版级事故**。
      # 三层防线：
      #   Windows（btls-sys 的 build.rs 在 windows host 无条件 OPENSSL_NO_ASM=YES，
      #   上游 build/main.rs:315-318 原注释 "not set up for cross-compiling using
      #   Visual Studio"）→ 唯一正解 = 上面的 setup-boringssl-asm 预构建带汇编库
      #   （NASM 缺失/编不出都 hard-fail，产不出不发版）；
      #   Linux/macOS/musl（非 windows host，btls-sys 不设 NO_ASM）→ cmake 默认带
      #   汇编（走 perl→GAS/.S，NASM 并非其消费者，装它只为对齐配方与兜后手）；
      #   构建后「Verify assembly BoringSSL」门逐靶断言（见 Build release 之后）。
      - name: Install nasm (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y -q nasm
      - name: Install protoc
        shell: pwsh
        run: |
          if ($env:RUNNER_OS -eq "Linux") {
            # ubuntu-22.04 默认 protobuf-compiler 3.12 不支持 proto3 optional
            # 装新 protoc 25.1 到 /usr/local/bin（apt 旧版被 PATH 覆盖）
            sudo apt-get update -qq
            sudo apt-get install -y -qq unzip wget
            sudo wget -q https://github.com/protocolbuffers/protobuf/releases/download/v25.1/protoc-25.1-linux-x86_64.zip -O /tmp/protoc.zip
            sudo unzip -q -o /tmp/protoc.zip -d /usr/local
            sudo rm /tmp/protoc.zip
          } elseif ($env:RUNNER_OS -eq "macOS") {
            brew install protobuf
          } else {
            # Windows: 依赖图含 xray-proto(prost-build)需要 protoc
            # choco shim 间歇未生成（Out-Null 吞错）→ 改直连下载 protoc 25.1
            $protocZip = "$env:RUNNER_TEMP\protoc.zip"
            $protocDir = "$env:RUNNER_TEMP\protoc"
            Invoke-WebRequest -Uri "https://github.com/protocolbuffers/protobuf/releases/download/v25.1/protoc-25.1-win64.zip" -OutFile $protocZip
            Expand-Archive -Path $protocZip -DestinationPath $protocDir -Force
            echo "$protocDir\bin" | Out-File -FilePath $env:GITHUB_PATH -Append
          }
          # GITHUB_PATH 对本步不生效，版本检查仅非 Windows（Linux/macOS 即时装好）
          if ($env:RUNNER_OS -ne "Windows") { Write-Host "protoc: $(protoc --version)" }
      # musl 交叉:C/C++ 依赖(boringssl/aws-lc)经 zig 工具链(探针 38024052697 实证配方)
      - name: Install zig (musl target only)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          wget -q https://ziglang.org/download/0.13.0/zig-linux-x86_64-0.13.0.tar.xz
          tar xJf zig-linux-x86_64-0.13.0.tar.xz -C /opt
          echo "/opt/zig-linux-x86_64-0.13.0" >> "$GITHUB_PATH"
          # GITHUB_PATH 对当前步不生效,下一步才消费
      - name: Install cargo-zigbuild (musl target only)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2.90.2
        with:
          tool: cargo-zigbuild
      - name: Build release (musl via zigbuild)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: cargo zigbuild --release -p xray-cli --target ${{ matrix.target }}
      - name: Build release
        if: matrix.target != 'x86_64-unknown-linux-musl'
        run: cargo build --release -p xray-cli --target ${{ matrix.target }}

      # ── 产物汇编门（逐靶，红即不发版）────────────────────────────────────
      # Windows：btls-sys 走预构建路线（跳过 cmake），本仓没有可查的 CMakeCache →
      #   断言 BORING_BSSL_PATH 已导出、预构建库齐全，并复跑 tools/
      #   build_boringssl_asm.py --check（其判据 = 自产 CMakeCache 无
      #   OPENSSL_NO_ASM + CMAKE_ASM_NASM_COMPILER_WORKS=1 + crypto.lib 体量）。
      # 非 Windows：btls-sys 走 cmake，判据直接取它的 build/out/build/CMakeCache.txt
      #   ——里面**不得出现 OPENSSL_NO_ASM**（本机 NO_ASM 时代的 11 个 btls-sys-* 残留
      #   目录实证：NO_ASM 时 cache 恒有 `OPENSSL_NO_ASM:INTERNAL=YES`；asm 开时该键
      #   根本不进 cache）。setup-boringssl 每次清残留目录 → 命中的是本次构建。
      #   取 mtime 最新一份（ls -t），防旧缓存串扰。
      # musl(zig) / 交叉 apple 靶同门：工具链若哪天编不出汇编，这里红——宁红不发慢库。
      - name: Verify assembly BoringSSL (artifact gate)
        shell: bash
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = "Windows" ]; then
            [ -n "${BORING_BSSL_PATH:-}" ] || { echo "::error::BORING_BSSL_PATH 未导出——btls-sys 将退回 cmake→OPENSSL_NO_ASM=YES 慢库（31.6 vs 241.2 MB/s，bd jyipl）"; exit 1; }
            for f in crypto.lib ssl.lib include/openssl/ssl.h; do
              [ -e "$BORING_BSSL_PATH/$f" ] || { echo "::error::汇编预构建库缺 $f"; exit 1; }
            done
            python3 tools/build_boringssl_asm.py --check --src "$BORING_BSSL_SOURCE_PATH" --dest "$BORING_BSSL_PATH"
          else
            cache="$(ls -t "target/${{ matrix.target }}"/release/build/btls-sys-*/out/build/CMakeCache.txt 2>/dev/null | sed -n 1p || true)"
            if [ -z "$cache" ]; then
              echo "::error::未找到 btls-sys 的 CMakeCache——cmake 路线没跑，无法证明汇编在"
              exit 1
            fi
            echo "体检对象: $cache"
            if grep -q 'OPENSSL_NO_ASM' "$cache"; then
              echo "::error::CMakeCache 含 OPENSSL_NO_ASM → 汇编被关（NO_ASM 慢库，见 bd jyipl）"
              exit 1
            fi
            echo "[ok] CMakeCache 无 OPENSSL_NO_ASM（汇编开）"
          fi

      # bd 3t30l：发布产物此前「只构建、零测试」——发出去的二进制从未在任何门里跑过。
      # 这里用 hermetic（全环回 + 脚本内 local upstream，无外网、无 Go 基线、无真实节点）
      # 的 rust-only 互通套件当场验证**刚构建出的产物**：12 例 Rust<->Rust（同配双轮，
      # 覆盖 vmess / vless-vision-tls / trojan / ws / ss / ss2022 主协议）。Linux 与
      # Windows 产物跑同一套 → 两侧对等性有实测证据，而非「同一次构建」的推断。
      # 32/32 真机矩阵属 nightly（interop.yml 的 full32 job），release 门不重复。
      # 跳过 x86_64-apple-darwin：它是 macOS arm64 runner 交叉编出的 x86_64 产物，能否
      # 执行取决于 runner 上的 Rosetta——不把基础设施运气当发布门。
      - name: Ensure openssl on PATH (Windows smoke)
        if: matrix.target == 'x86_64-pc-windows-msvc'
        shell: pwsh
        run: |
          if (Get-Command openssl -ErrorAction SilentlyContinue) { openssl version; exit 0 }
          $gitOpenssl = "$env:ProgramFiles\Git\usr\bin"
          if (-not (Test-Path "$gitOpenssl\openssl.exe")) {
            throw "openssl 不可用：release 互通冒烟需要它生成 TLS 证书"
          }
          echo "$gitOpenssl" | Out-File -FilePath $env:GITHUB_PATH -Append
          & "$gitOpenssl\openssl.exe" version
      - name: Hermetic interop smoke (built artifact, rust-only, local upstream)
        if: matrix.target != 'x86_64-apple-darwin'
        shell: bash
        run: |
          set -euo pipefail
          bin="target/${{ matrix.target }}/release/${{ matrix.bin }}"
          # 预热：刚编出的 50MB 产物首次执行会吃满磁盘/杀软首扫（本机实测冷启 >15s，
          # harness 的 client 就绪窗正好 15s → 第 1 例假红）。预热后连跑 12/12 全绿；
          # 顺带把版本行打进日志（产物可执行 = 第一个证据）。
          "$bin" version
          python3 dist/interop_ci.py \
            --rust "$bin" \
            --suites rust \
            --upstream local \
            --work "$RUNNER_TEMP/interop_release"
      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.artifact }}
          path: target/${{ matrix.target }}/release/${{ matrix.bin }}
      # bd u27c7：发布二进制 strip 掉符号表（体积），线上 panic/abort 回溯符号化靠这些
      # 旁路文件（Cargo.toml [profile.release] debug=line-tables-only + split-debuginfo=
      # unpacked）。实测布局（ubuntu + 同代 nightly 验证）：Linux/macOS 的 DWARF 落在
      # deps/*.rcgu.dwo（不是 .o——cargo 不留 .o），Windows 是链接期 .pdb。
      # fail-visible：Linux 腿（= 生产 176 台的部署面）产出零符号文件即红，不留空工件。
      - name: Verify debug symbols produced (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          rel="target/${{ matrix.target }}/release"
          n=$(ls "$rel"/*.dwo "$rel"/*.dwp "$rel"/deps/*.dwo "$rel"/deps/*.dwp 2>/dev/null | wc -l)
          echo "调试符号旁路文件: $n（$rel）"
          if [ "$n" -eq 0 ]; then
            echo "::error::未产出 .dwo/.dwp——debug/split-debuginfo 配置失效，线上 panic 无法符号化"
            exit 1
          fi
      - name: Upload debug symbols (panic 回溯符号化)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: debug-symbols-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/*.pdb
            target/${{ matrix.target }}/release/*.dwp
            target/${{ matrix.target }}/release/*.dwo
            target/${{ matrix.target }}/release/deps/*.dwp
            target/${{ matrix.target }}/release/deps/*.dwo
          if-no-files-found: warn
          retention-days: 90

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # 随包文档（README.md / LICENSE）来自工作树，故 release job 需要 checkout
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: artifacts
      # 四平台二进制同叫 xray/xray.exe，artifacts/** 直接上传会同名互相覆盖
      # （首发实锤只剩 2 个文件）——先拍平重命名为 artifact 名。
      # 必须先清空 dist/：仓库里 dist/ 还入库了 interop 脚本（interop_*.py /
      # run_all.py / uriclient.py，interop.yml 在用），package_release.py 会给
      # dist/ 里每个文件都打 zip+dgst，`files: dist/**` 再全量上传 —— v26.10.11-rust.1
      # 发布页因此混进 48 个脚本资产。发布目录只允许本次构建出的二进制。
      - name: Rename artifacts
        run: |
          rm -rf dist
          mkdir -p dist
          for d in artifacts/*/; do
            name=$(basename "$d")
            cp "$d"/* "dist/$name"
          done
          ls -la dist/
      # 资产门（G-18）在发版前再跑一次：ci.yml 只覆盖分支 push/PR，tag push 不触发，
      # 若发版分支带来引用 geo 资产的配置而包里没有 dat，二进制起得来但路由静默失效。
      - name: Check geo assets
        run: python3 tools/check_geo_assets.py
      # G-21：产物内 README+LICENSE、zip 打包、md5/sha1/sha256/sha512 dgst
      - name: Package archives + digests
        run: python3 tools/package_release.py dist
      - name: Create release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: dist/**
          generate_release_notes: true
