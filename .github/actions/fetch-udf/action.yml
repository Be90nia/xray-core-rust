name: 'Fetch udf-frame (pinned revision)'
description: >-
  按 pin 文件 .github/udf-frame.rev 拉取钉死的 udf-frame revision（issue #68 决断
  2026-11-18：required CI 禁消费移动 main）。流程 = 校验 pin（缺失/非 40-hex 一律
  fail-closed）→ git fetch --depth 1 origin <pin> + checkout --detach → 硬校验
  rev-parse HEAD == pin（不等即 exit 1）→ 导出 UDF_HEAD=pin（rust-cache 键接口
  不变）。上游红绿判定已不在 required CI：消费绿由「更新 pin 时人工验证上游全绿」
  流程保证（docs/ops/udf-frame-pin.md）；main 最新由 udf-canary.yml 每日独立测试
  （非阻断）。锚测试（xray-conf udf_rev_anchor）真值源 = 同一 pin 文件，CI 侧
  HEAD=pin 可真校验（收口 bd yyoy9）。

runs:
  using: composite
  steps:
    - name: Fetch udf-frame at pinned revision
      shell: bash
      run: |
        set -euo pipefail
        pin_file=".github/udf-frame.rev"
        remote="https://github.com/Be90nia/udf-frame.git"

        if [ ! -f "${pin_file}" ]; then
          echo "::error::pin 文件 ${pin_file} 不存在——udf-frame 消费已钉死，缺 pin 即拒启（issue #68 fail-closed）。修法：git -C crates/udf-frame rev-parse HEAD > ${pin_file}，流程见 docs/ops/udf-frame-pin.md"
          exit 1
        fi
        pin="$(tr -d ' \t\r\n' < "${pin_file}")"
        if ! grep -Eq '^[0-9a-f]{40}$' <<<"${pin}"; then
          echo "::error::pin 文件 ${pin_file} 内容不是单行 40-hex 小写全 SHA（得到「${pin}」）——fail-closed，禁短 SHA/大写/多行。修法：git -C crates/udf-frame rev-parse HEAD > ${pin_file}"
          exit 1
        fi
        if [ -e crates/udf-frame ]; then
          echo "::error::crates/udf-frame 已存在（checkout 后预期不存在）——拒绝操作既有目录，人工核对清理后再跑"
          exit 1
        fi

        git init --quiet crates/udf-frame
        git -C crates/udf-frame remote add origin "${remote}"
        git -C crates/udf-frame fetch --quiet --depth 1 origin "${pin}"
        git -C crates/udf-frame checkout --quiet --detach FETCH_HEAD

        head="$(git -C crates/udf-frame rev-parse HEAD)"
        if [ "${head}" != "${pin}" ]; then
          echo "::error::硬校验失败：HEAD=${head} != pin=${pin}——拉到的不是钉死 revision，fail-closed 拒消费"
          exit 1
        fi

        echo "UDF_HEAD=${pin}" >> "$GITHUB_ENV"
        {
          echo "### udf-frame 拉料（pinned，issue #68）"
          echo "- pinned SHA: \`${pin}\`（= 本 run 全部 job 的 UDF_HEAD：rust-cache 键 + 本摘要；真值源 \`${pin_file}\`，本 run 已硬校验 HEAD == pin）"
          echo "- 更新 pin：验证上游全绿 → 改 pin → 本地锚测试+全门 → PR（docs/ops/udf-frame-pin.md）；main 最新由 udf-canary workflow 独立测试（非阻断）"
          echo "- 本 run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          echo "- udf runs: https://github.com/Be90nia/udf-frame/actions"
        } >> "$GITHUB_STEP_SUMMARY"
