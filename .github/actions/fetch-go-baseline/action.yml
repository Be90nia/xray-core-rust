name: 'Fetch Go baseline (pinned commit build)'
description: >-
  取得「裁定基准」Go Xray 二进制（bd t3wtj：基准版本收敛到本文件一处）。
  基准 = v26.11.9（commit 676eaf66f8f05d4d558ee7a74b4736623d3feeb9）。
  **为什么按 commit 构建**：v26.10.17 上游从未发布二进制（releases 与 tags 双双查无）；
  v26.11.9 上游**已**发布 release 资产（Xray-linux-64.zip 等），可改走 asset 路线
  （CI 更快，但需恢复按平台的 asset 映射表 + sha256 校验）——本轮取最小改动，
  沿用 commit 构建；升级基准 = 改本文件 env 两行（VERSION + COMMIT）+ 跑一次 CI。
  完整性锚点 = 「commit sha（不可变）+ go.sum 模块校验和」+ 构建后断言
  `xray version` 输出确为基准版本号（错版本立即红）。

inputs:
  out:
    description: '输出二进制路径（相对仓库根；Windows 消费方请自带 .exe 后缀）'
    required: false
    default: tools/xray-go/xray

runs:
  using: composite
  steps:
    # 26.11.9 的 go.mod 声明 `go 1.27`（与 26.10.17 同代）：低版本 go 会尝试
    # GOTOOLCHAIN 自动下载（CI 允许，但多一次网络依赖与失败面），故显式装同代工具链。
    - name: Install Go toolchain
      uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
      with:
        go-version: '1.27.x'
        cache: false

    - name: Build Go baseline from pinned commit
      shell: bash
      env:
        BASELINE_VERSION: '26.11.9'
        BASELINE_COMMIT: '676eaf66f8f05d4d558ee7a74b4736623d3feeb9'
        OUT: ${{ inputs.out }}
      run: |
        set -euo pipefail
        src="${RUNNER_TEMP}/xray-go-src"
        rm -rf "$src" && mkdir -p "$src"
        # codeload tar = 该 commit 的源码快照（无 .git 历史，比 clone 全仓省时省盘）
        curl -fsSL "https://codeload.github.com/XTLS/Xray-core/tar.gz/${BASELINE_COMMIT}" \
          | tar xz -C "$src" --strip-components=1
        mkdir -p "$(dirname "$GITHUB_WORKSPACE/${OUT}")"
        ( cd "$src" && go build -trimpath -o "$GITHUB_WORKSPACE/${OUT}" ./main )
        ver="$("$GITHUB_WORKSPACE/${OUT}" version | head -1)"
        echo "Go 基准二进制: $GITHUB_WORKSPACE/${OUT}"
        echo "版本行: ${ver}"
        if ! printf '%s' "$ver" | grep -q "Xray ${BASELINE_VERSION} "; then
          echo "::error::Go 基准版本不符：期望 ${BASELINE_VERSION}（commit ${BASELINE_COMMIT}），实得: ${ver}"
          exit 1
        fi
        # 消费方统一用 $GO_BASELINE_BIN，不必知道路径细节
        echo "GO_BASELINE_BIN=$GITHUB_WORKSPACE/${OUT}" >> "$GITHUB_ENV"
